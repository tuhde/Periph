# Machine-readable mirror of specs/motor/drv8830.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Register write cycle: a single CONTROL or FAULT register write (START,
# address, sub-address, data, STOP) at 400 kHz Fast-mode clock. This is the
# only host-observable, conformance-checkable timing constraint the chip
# has - the current-limit/fault-registration/soft-start timings in the
# spec's Timing Constraints section are all autonomous hardware behavior
# with no I2C signature.
register_write_max_us=90
register_write_samplerate=4m
register_write_capture_ms=300
