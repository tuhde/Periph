# Machine-readable mirror of specs/motor/tmc5160.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# datagram (SPI): a 40-bit SPI datagram, CSN falling edge (datagram_start) to
# CSN rising edge (datagram_end), must take at least 10 us: 40 SCK clocks at
# the maximum 4 MHz SCK allowed with the internal oscillator. Host-observable,
# conformance-checkable on SPI captures.
datagram_min_us=10
datagram_samplerate=24m
datagram_capture_ms=300

# reply_delay (UART): after the last stop bit of a read request
# (read_request_end) the chip waits SENDDELAY (default 8 bit times) before
# the first reply byte (read_reply_start). At 115200 baud the default is
# about 69 us; the bound is 100 us. Ramp-generator update, standstill
# power-down, StealthChop start-up and StallGuard2 update timings are
# autonomous hardware behavior with no bus signature.
reply_delay_max_us=100
reply_delay_samplerate=4m
reply_delay_capture_ms=500
