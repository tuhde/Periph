# Machine-readable mirror of specs/motor/drv2605.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation",
# for the schema.

# calibration: from the write of 1 to GO (0x0C) while MODE=7 (cal_start)
# to the first read of 0x0C returning GO=0 (cal_done). calibrate() programs
# AUTO_CAL_TIME=3, whose datasheet window is 1000 ms (min) to 1200 ms
# (max); allow 1300 ms for bus + polling overhead.
calibration_max_ms=1300
calibration_samplerate=10k
calibration_capture_ms=2500

# Informational only (no conformance check):
# Power-up before I2C access: >= 250 us.
# GO/trigger to output: 0.7 ms; EN high to output (PWM/analog): 1.5 ms.
# DEV_RESET: no duration documented; wait >= 1 ms.
