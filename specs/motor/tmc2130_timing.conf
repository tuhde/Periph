# Machine-readable mirror of specs/motor/tmc2130.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# datagram: a 40-bit SPI datagram, CSN falling edge (datagram_start) to CSN
# rising edge (datagram_end), must take at least 10 us: 40 SCK clocks at the
# maximum 4 MHz SCK allowed with the internal oscillator. This is the only
# host-observable, conformance-checkable timing constraint the chip has -
# standstill power-down, StealthChop start-up and StallGuard2 update timings
# are autonomous hardware behavior with no bus signature.
datagram_min_us=10
datagram_samplerate=24m
datagram_capture_ms=300
