# Machine-readable mirror of specs/motor/tmc2208.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Read reply delay: after the last stop bit of a read request the chip waits
# SENDDELAY (default 8 bit times) before sending the first reply byte. At
# 115200 baud (8.68 us bit time) that is ~69 us; the conformance bound is
# 100 us at that baud rate and the default SENDDELAY. Measured from the
# end of the last request byte (read_request_end) to the start of the first
# reply byte (read_reply_start). The other Timing Constraints entries
# (inter-byte gap, error recovery idle time, TPOWERDOWN, StealthChop
# auto-tune, power-up) are autonomous chip behaviour or driver-side waits
# with no checkable bus signature.
reply_delay_max_us=100
reply_delay_samplerate=4m
reply_delay_capture_ms=500
