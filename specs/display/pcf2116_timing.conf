# Machine-readable mirror of specs/display/pcf2116.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PCF2116's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the instruction execution
# times (3 / 165 oscillator cycles) and the 2 ms power-on / clear-display
# waits end without a bus event (the busy flag is not read by the drivers),
# and the I2C limits are clock-rate properties. This file intentionally
# defines no checks.
