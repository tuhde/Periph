# Machine-readable mirror of specs/display/bu9796.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to first transaction: the datasheet's start sequence waits at
# least 100 us after VDD rises before the first START. No dedicated
# power-sense channel exists in this repo's testconfig_wiring (only SCL/SDA
# are captured), so this is measured from capture start to the first
# decoded transaction - the operator is expected to power the board right
# as the capture begins (same pattern as pcf8576's and aht21's
# poweron_ready checks).
poweron_ready_min_us=100
poweron_ready_samplerate=1m
poweron_ready_capture_ms=50
