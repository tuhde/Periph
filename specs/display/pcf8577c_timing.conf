# Machine-readable mirror of specs/display/pcf8577c.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# The PCF8577C datasheet states no power-on or command-to-effect delay that
# has a bus-decodable start/end annotation pair or a stated bound: power-on
# reset is internal and the display is blank afterwards, and the only
# timing figures are the I2C clock-rate limits. This file intentionally
# defines no checks.
