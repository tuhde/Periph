# Machine-readable mirror of specs/display/ssd1683.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SSD1683's stated timing constraints can be checked as a
# start/end annotation delta against a datasheet bound:
#   - the display update (BUSY high after command 0x20) has only a typical
#     duration in the module datasheet (about 14 s at 25 C) and no maximum,
#   - the power-up, reset and software-reset delays are recommended waits
#     (reference code values), not measured events with a closing annotation,
#   - the SPI limits (fSCL <= 20 MHz, CS# setup/hold, pulse widths) are
#     clock-rate and setup/hold properties of the bus, not event-to-event delays.
#
# The chip decoder has no timing row (it checks that BUSY is active at the CS# rising edge of a
# command that must drive it, as a warning); the connection decoder `display_spi` emits the
# polarity-neutral busy_fall / busy_rise and res_fall / res_rise edge markers. No bound is
# configured here. If a vendor
# maximum for the update time becomes available, add a timing annotation pair to the chip
# decoder and
#   display_update_max_ms / display_update_samplerate / display_update_capture_ms
# here.
#
# This file intentionally defines no checks.
