# Machine-readable mirror of specs/display/uc8276c.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the UC8276C's stated timing constraints can be checked as a
# start/end annotation delta against a datasheet maximum:
#   - the refresh (BUSY_N low after DRF) has no stated duration in the chip or
#     panel datasheet, so there is no bound to compare against,
#   - the reset widths (RST_N low >= 50 us, > 1 ms before the first command)
#     and the "first FLG read > 200 us after BUSY_N falls" rule are minimum
#     waits, flagged by the decoder as warnings rather than max-delay checks,
#   - the SPI limits (write cycle >= 100 ns, read cycle >= 350 ns, CSB/DC
#     setup and hold) are bus-rate properties, not event-to-event delays.
#
# The chip decoder has no timing row (it checks that BUSY is active at the CS# rising edge of a
# command that must drive it, as a warning); the connection decoder `display_spi` emits the
# polarity-neutral busy_fall / busy_rise and res_fall / res_rise edge markers. No bound is
# configured here. If a vendor
# maximum for the refresh time becomes available, add a timing annotation pair to the chip
# decoder and
#   display_refresh_max_ms / display_refresh_samplerate / display_refresh_capture_ms
# here.
#
# This file intentionally defines no checks.
