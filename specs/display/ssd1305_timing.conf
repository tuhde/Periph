# Machine-readable mirror of specs/display/ssd1305.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SSD1305's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the display-on delay (tAF) and
# the power-off delay (tOFF) are recommended waits around commands and supply
# switching (not measured events with a closing annotation), reset is an
# external-pin event outside the bus, and the I2C and SPI limits are
# setup/hold and clock-rate properties rather than event-to-event delays.
# This file intentionally defines no checks.
