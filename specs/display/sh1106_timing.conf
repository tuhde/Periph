# Machine-readable mirror of specs/display/sh1106.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SH1106's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the DC-DC / display-on delays
# are recommended waits after commands (not measured events with a closing
# annotation), reset is an external-pin event outside the bus, and the I2C
# and SPI limits are setup/hold and clock-rate properties rather than
# event-to-event delays. This file intentionally defines no checks.
