# Machine-readable mirror of specs/display/pcf8576.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to first transaction: >=1 ms internal POR settling time before
# the first I2C transaction. No dedicated power-sense channel exists in
# this repo's testconfig_wiring (only SCL/SDA are captured), so this is
# measured from capture start to the first decoded transaction - the
# operator is expected to power the board right as the capture begins. See
# conformance/display/pcf8576_conformance.py and find_delta_samples()'s
# is_start=None case in _sigrok_conformance.py (same pattern AHT21's own
# poweron_ready check uses).
poweron_ready_min_ms=1
poweron_ready_samplerate=100k
poweron_ready_capture_ms=50
