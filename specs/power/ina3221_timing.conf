# Machine-readable mirror of specs/power/ina3221.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Conversion-ready latency at the default configuration (VBUSCT=100=1.1 ms,
# VSHCT=100=1.1 ms, all 3 channels enabled, shunt+bus continuous mode):
# CVRF sets within ~6.6 ms of the Configuration Register write that cleared
# it ((VBUSCT + VSHCT) x 3 enabled channels). Sampled fast enough to
# resolve individual I2C bus edges within that window.
conversion_ready_max_ms=8
conversion_ready_samplerate=1m
conversion_ready_capture_ms=20
