# Machine-readable mirror of specs/power/lm25066.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the LM25066's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the ADC sampling (1 kHz),
# the averaging periods (2^AVGN ms) and the temperature averaging are
# internal and end without a bus event, the insertion/fault timers are
# hardware (TIMER capacitor), and the SMBus limits are setup/hold and
# clock-rate properties rather than event-to-event delays. This file
# intentionally defines no checks.
