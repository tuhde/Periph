# Machine-readable mirror of specs/power/ina226.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Conversion-ready latency at the default configuration (VBUSCT=100=1.1 ms,
# VSHCT=100=1.1 ms, shunt+bus continuous mode): CVRF sets within ~2.2 ms of
# the Configuration Register write that cleared it. Sampled fast enough to
# resolve individual I2C bus edges within that window.
conversion_ready_max_ms=3
conversion_ready_samplerate=1m
conversion_ready_capture_ms=10
