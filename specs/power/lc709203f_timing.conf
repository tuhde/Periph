# Machine-readable mirror of specs/power/lc709203f.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the LC709203F's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: TINIT (reset release /
# 0x12 write to operational mode) and the 1.5 ms RSOC initialization end
# without any bus event, the wake-up window is defined against SDA edges
# outside normal transactions, and the I2C limits are setup/hold and
# clock-rate properties rather than event-to-event delays. This file
# intentionally defines no checks.
