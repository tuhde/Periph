# Machine-readable mirror of specs/power/max17048.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MAX17048's timing constraints have a bus-decodable start/end
# annotation pair to check against: the ADC samples are free-running and
# produce no bus event, the first-SOC delay after power-on reset starts
# with a supply edge outside the I2C bus, hibernate/sleep entry depend on
# battery activity and bus-low periods, and the I2C limits are clock-rate
# properties. This file intentionally defines no checks.
