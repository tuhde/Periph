# Machine-readable mirror of specs/power/ade7953.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# ADE7953 power-up hold-off: VDD must reach its operating range before any
# I²C access; the chip asserts Reset (bit 20 of IRQSTATA) at the end of
# its 100 ms+ internal start-up. The Required Power-Up Register Setting
# (write 0xFE = 0xAD, then 0x120 = 0x30) must follow before any other
# register access. Decode captures a window wide enough to span the
# reset interrupt and the first driver-side read.
powerup_after_reset_min_ms=100
powerup_after_reset_samplerate=1m
powerup_after_reset_capture_ms=200