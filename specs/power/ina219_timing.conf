# Machine-readable mirror of specs/power/ina219.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Recovery from power-down mode: >= 40 us from a Configuration write that
# sets an active (non-zero) MODE to the next bus transaction. Sampled fast
# enough to resolve individual I2C bus edges within that window.
wake_recovery_min_us=40
wake_recovery_samplerate=1m
wake_recovery_capture_ms=5

# Maximum conversion time at 128-sample averaging: <= 68.10 ms between
# successive Bus Voltage reads showing CNVR=1 (shunt and bus run
# sequentially in continuous mode, so this is the worst-case bound across
# every BADC/SADC averaging setting - see the chip spec's Timing
# Constraints). Sampled slowly enough to cover the full window without an
# excessive sample count.
conversion_cycle_max_ms=68.10
conversion_cycle_samplerate=100k
conversion_cycle_capture_ms=140
