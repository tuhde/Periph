# specs/other/mpr121_timing.conf
# Machine-readable mirror of specs/other/mpr121.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Soft reset ready: write of 0x63 to register 0x80 to first I2C transaction
# to the chip (≥ 1 ms). The chip's I2C module is not reset, only the
# internal state, so the next transaction is allowed as soon as the
# internal reset completes.
soft_reset_ready_min_ms=1
soft_reset_ready_samplerate=100k
soft_reset_ready_capture_ms=20

# Autoconfiguration ready: write of ECR with ELE_EN>0 to first valid
# baseline at 0x1E-0x29 (practical safe-wait form: ≤ 50 ms after the ECR
# write). At the spec's default ESI=16 ms and FFI=00 (6 samples) the
# datasheet bound is ESI * FFI_samples * 13 * 2 = 16 * 6 * 13 * 2 = 2496
# ms in the worst case, but with ACE=1 and one-shot autoconfig the
# practical safe wait per the spec is 50 ms.
autoconfig_ready_min_ms=0
autoconfig_ready_max_ms=50
autoconfig_ready_samplerate=1m
autoconfig_ready_capture_ms=80
