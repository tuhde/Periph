# specs/other/pca9541_timing.conf
# Machine-readable mirror of specs/other/pca9541.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PCA9541's stated timing constraints have a bus-decodable
# start/end annotation pair on the master's own bus that the host must
# honour: the bus-free wait after a switch is on the downstream bus, the
# RESET and INT_IN timings are pin-level events, bus-initialization clocking
# is internal, and the I2C limits are setup/hold and clock-rate properties.
# This file intentionally defines no checks.
