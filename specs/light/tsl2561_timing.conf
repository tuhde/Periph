# Machine-readable mirror of specs/light/tsl2561.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Integration time at the driver's default of 402 ms: from the CONTROL write
# that powers the device up (conversion_start) to the first read of the ADC
# data registers (conversion_done), the driver must wait at least the
# nominal 402 ms; the datasheet's oscillator tolerance (690...780 kHz around
# 735 kHz, i.e. -6 %) gives the checked minimum of 378 ms.
conversion_done_min_us=378000
conversion_done_samplerate=100k
conversion_done_capture_ms=1500
