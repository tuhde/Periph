# None of the APDS-9250's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the integration time and
# measurement rate are programmable settings, the end of a conversion is
# marked only by MAIN_STATUS.LS_DATA (no separate bound), and the I²C limit
# is a clock-rate property.
