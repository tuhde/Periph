# Machine-readable mirror of specs/light/max44009.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MAX44009's stated timing constraints have a bus-decodable
# start/end annotation pair that the host must honour: the measurement cycle
# (800 ms / integration time), ADC conversion time and the interrupt
# threshold delay are autonomous chip behavior, and the I2C limits are
# setup/hold and clock-rate properties. This file intentionally defines no
# checks.
