# Machine-readable mirror of specs/light/bh1750.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the BH1750FVI's timing constraints has a bus-decodable start/end
# annotation pair to check against: the chip has no status register or
# interrupt, so the end of a measurement is not marked by any bus event (the
# host simply waits and reads), the DVI reset is a pin event outside the I2C
# bus, and the I2C limit is a clock-rate property. This file intentionally
# defines no checks.
