# Machine-readable mirror of specs/light/si1133.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the Si1133's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the start-up time is a host wait,
# the measurement end is marked only by `IRQ_STATUS`/`RESPONSE0` for which
# the preliminary datasheet gives no maximum time, and the I²C limit is a
# clock-rate property.
# This file intentionally defines no checks.
