# specs/light/apds-9930_timing.conf
# Machine-readable mirror of specs/light/apds-9930.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on ready: VDD stable to first I2C transaction (spec Timing
# Constraints). Sampled slowly - this is a millisecond-scale event measured
# from the first bus edge after power-up.
poweron_ready_min_ms=4.5
poweron_ready_samplerate=1m
poweron_ready_capture_ms=15

# First conversion ready: PON set to first STATUS with AVALID=1 and PVALID=1.
# At the spec's default ATIME=0xDB (101 ms) and PTIME=0xFF (2.73 ms), the
# first full cycle is bounded by the ALS cycle (~101 ms) plus margin for the
# proximity pulse accumulation (PPULSE=8 pulses x 16 us, negligible).
first_conversion_ready_min_ms=12
first_conversion_ready_max_ms=120
first_conversion_ready_samplerate=1m
first_conversion_ready_capture_ms=150

# ALS integration time at ATIME=0xDB (37 cycles, 101 ms nominal). The
# chip datasheet gives ALSIT = 2.73 x (256 - ATIME) ms; at ATIME=0xDB this
# is 101 ms. Bound it loosely to allow for scheduling jitter on the
# capturing host.
als_integration_time_min_ms=95
als_integration_time_max_ms=115
als_integration_time_samplerate=10k
als_integration_time_capture_ms=150

# Proximity integration time at PTIME=0xFF (1 cycle, 2.73 ms nominal,
# plus PPULSE x 16 us LED pulse accumulation time which is negligible at
# PPULSE=8). The chip datasheet gives prox ADC time as 2.73 x
# (256 - PTIME) ms.
proximity_integration_time_min_ms=2.5
proximity_integration_time_max_ms=3.5
proximity_integration_time_samplerate=1m
proximity_integration_time_capture_ms=20