# Machine-readable mirror of specs/light/veml7700.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the VEML7700's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the integration time and the
# power-saving refresh time are internal and end without a bus event (the
# chip has no data-ready flag), the bus time-out is a failure mode, and the
# I2C limits are clock-rate properties. This file intentionally defines no
# checks.
