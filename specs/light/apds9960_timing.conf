# specs/light/apds9960_timing.conf
# als_integration: PON to first AVALID is one complete ALS integration cycle
# after AEN is set (spec Timing Constraints). At the driver's default
# ATIME=0xB6 (72 cycles), integration is ~200 ms; bound it loosely to allow
# for scheduling jitter on the capturing host.
als_integration_min_ms=150
als_integration_max_ms=400
als_integration_samplerate=10k
als_integration_capture_ms=500
