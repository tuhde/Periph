# Machine-readable mirror of specs/light/si1132.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the Si1132's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the start-up time and the post-
# reset wait are host waits, the measurement end is marked only by the
# `IRQ_STATUS`/`RESPONSE` flags for which the datasheet gives no maximum
# time, and the I²C limit is a clock-rate property.
# This file intentionally defines no checks.
