# Machine-readable mirror of specs/magnetometer/as5600.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Burn command to OTP completion: >=1 ms from the BURN command write
# (Burn_Angle 0x80 or Burn_Setting 0x40) to the first byte of the OTP
# reload/verify sequence (0x01 written to BURN). Sampled fast enough to
# resolve individual I2C bus edges within that window.
burn_settle_min_ms=1
burn_settle_samplerate=1m
burn_settle_capture_ms=50

# Power-on to first I2C access: <=10 ms. No dedicated power-sense channel
# exists in this repo's testconfig_wiring, so the checker measures from
# capture start (the operator is expected to power the board right as the
# capture begins) to the first successful bus transaction - see
# as5600_conformance.py and conformance/environmental/aht21_conformance.py's
# docstring for the same pattern.
poweron_ready_max_ms=10
poweron_ready_samplerate=10k
poweron_ready_capture_ms=50
