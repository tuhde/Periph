# Machine-readable mirror of specs/magnetometer/mag3110.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MAG3110's stated timing constraints has a bus-decodable
# start/end annotation pair with a datasheet bound to check against: the
# measurement period is the programmed ODR (data readiness is signalled by
# DR_STATUS / INT1), the magnetic sensor reset has no stated duration (the
# Mag_RST bit self-clears), and the I2C limits are clock-rate properties.
# This file intentionally defines no checks.
