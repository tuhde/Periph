# Machine-readable mirror of specs/magnetometer/ist8310.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the IST8310's timing constraints has a datasheet bound with a
# bus-visible start/done pair: the 50 ms power-on reset is a supply event, the
# single-measurement time is not documented in the public datasheet (DRDY is
# polled), and the I2C limits are clock-rate properties. This file
# intentionally defines no checks.
