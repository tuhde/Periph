# Machine-readable mirror of specs/imu/qmi8658a.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# After the soft reset (RESET register 0x60 written 0xB0): the system turn-on
# time is 15 ms maximum (datasheet Tables 7/8, section 7.4); no register
# access is allowed meanwhile. Measured from the RESET write to the next
# transaction.
reset_recovery_min_ms=15
reset_recovery_samplerate=100k
reset_recovery_capture_ms=60

# Gyroscope turn-on (datasheet Table 8, section 7.3: t1 = 150 ms typical):
# >=150 ms from the CTRL7 write that sets gEN (bit 1) to the first read of a
# sensor-data register (start address 0x33-0x40). The additional 3/ODR filter
# settling time is ODR-dependent and not checked.
gyro_startup_min_ms=150
gyro_startup_samplerate=100k
gyro_startup_capture_ms=400
