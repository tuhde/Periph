# Machine-readable mirror of specs/imu/mpu6050.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# After DEVICE_RESET (PWR_MGMT_1 bit 7): wait >=100 ms before writing
# configuration. Measured from the DEVICE_RESET write to the next PWR_MGMT_1
# write (the wake-up write, in this driver's init sequence).
reset_recovery_min_ms=100
reset_recovery_samplerate=100k
reset_recovery_capture_ms=200

# Gyroscope startup from sleep (datasheet Table 8): >=35 ms from the write
# that clears SLEEP (PWR_MGMT_1 bit 6) to the first sensor-data read at
# ACCEL_XOUT_H (0x3B).
gyro_startup_min_ms=35
gyro_startup_samplerate=100k
gyro_startup_capture_ms=80
