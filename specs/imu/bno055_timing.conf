# Machine-readable mirror of specs/imu/bno055.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# The BNO055's start-up (400 ms), POR (650 ms) and operation-mode switching
# times (7 ms / 19 ms) are single datasheet values without a bus-decodable
# start/end annotation pair (the chip simply does not ACK while booting), so
# there is no bound to check against. This file intentionally defines no
# checks.
