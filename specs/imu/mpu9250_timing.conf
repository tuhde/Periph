# Machine-readable mirror of specs/imu/mpu9250.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to register access: from the PWR_MGMT_1 write with
# DEVICE_RESET set (0x80), the driver must wait >=100 ms (datasheet
# maximum; 11 ms typical) before the first subsequent register read.
# Measured between the poweron_start and poweron_ready annotations.
poweron_ready_min_ms=100
poweron_ready_samplerate=10k
poweron_ready_capture_ms=150
