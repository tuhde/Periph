# Machine-readable mirror of specs/gas/scd30.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SCD30's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the delays (command-to-read,
# start-up, measurement interval) are minimum host waits from the interface
# description, and the I²C limit is a clock-rate property, so there is no
# bus-decodable start/end annotation pair with a datasheet bound.
# This file intentionally defines no checks.
