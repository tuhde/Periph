# Machine-readable mirror of specs/gas/sgp30.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SGP30's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the measurement durations are
# minimum host waits (the sensor NACKs the read header until the result is
# ready), the 1 s call interval and 15 s initialisation phase are algorithm
# requirements, and the I²C limit is a clock-rate property.
# This file intentionally defines no checks.
