# Machine-readable mirror of specs/gas/rrh46410.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the RRH46410's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the sample periods and warm-up are
# measurement-cycle times marked only by the `INT` pin (not a bus event),
# the reset wait is a host wait, and the I²C limit is a clock-rate property.
# This file intentionally defines no checks.
