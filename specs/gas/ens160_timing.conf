# Machine-readable mirror of specs/gas/ens160.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Warm-up (after idle or power-off): ~3 minutes until VALIDITY_FLAG clears
# from 1 (warm-up) to 0 (OK). Sampled slowly - this is a minutes-scale event.
warmup_time_min_s=180
warmup_time_samplerate=1k
warmup_time_capture_ms=182000

# Measurement response (T63): ~1 second between successive DATA_AQI reads
# once in STANDARD mode. Sampled fast enough to resolve individual I2C bus
# edges within that window.
measurement_cycle_max_ms=1000
measurement_cycle_samplerate=1m
measurement_cycle_capture_ms=1100
