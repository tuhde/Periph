# None of the CCS811's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the power-up and reset times and
# the nWAKE/nRESET timings are pin or supply events, the measurement
# interval is a mode property, and the I²C limit is a clock-rate property.
