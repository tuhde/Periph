# Machine-readable mirror of specs/gas/sgp40.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SGP40's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the measurement and self-test
# durations, the power-up and reset times are minimum host waits (the
# sensor NACKs the read header until the result is ready), the sampling
# interval is an algorithm requirement, and the I²C limit is a clock-rate
# property.
# This file intentionally defines no checks.
