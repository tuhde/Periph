# Machine-readable mirror of specs/adc_dac/ads7828.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the ADS7828's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the 6 us conversion time is
# shorter than any gap between the command byte and the data read at I2C
# rates, the internal-reference settling time is only given as a plot (no
# tabulated limit), and the I2C limits are clock-rate properties rather than
# event-to-event delays. This file intentionally defines no checks.
