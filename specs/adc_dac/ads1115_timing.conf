# Conversion time: from the Config write with OS=1 (conversion_start) to the
# first subsequent CONVERSION register read (conversion_done), the driver must
# wait >= 1 / DR. At the driver's default 128 SPS that is 7812.5 us. Measured
# between the conversion_start and conversion_done annotations.
conversion_done_min_us=7812
conversion_done_samplerate=4m
conversion_done_capture_ms=100
