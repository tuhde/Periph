# Machine-readable mirror of specs/adc_dac/pcf8591.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of PCF8591's stated timing constraints have a bus-decodable
# start/end annotation pair to check against (see
# conformance/adc_dac/pcf8591_conformance.py's docstring for why):
# ADC conversion time and DAC settling time are analog settling behaviors
# with no second digital event marking their completion, I2C max SCL is a
# clock-rate property rather than an event-to-event delay, and
# auto-increment reads are explicitly self-paced by the bus (no delay to
# verify). This file intentionally defines no checks.
