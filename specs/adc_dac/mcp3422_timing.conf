# Machine-readable mirror of specs/adc_dac/mcp3422.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# One-shot conversion time: from the config write with RDY=1, O/C=0
# (conversion_start) to the first subsequent read whose config byte has
# RDY=0 (conversion_done). At the driver's default 16 bit / 15 SPS the
# nominal time is 66.7 ms; the datasheet gives the data-rate tolerance only
# for 12 bit (176...328 SPS, i.e. up to 1.37x the nominal rate), so the
# checked minimum is 66.7 ms / 1.37 = 48.8 ms.
conversion_done_min_us=48800
conversion_done_samplerate=1m
conversion_done_capture_ms=500
