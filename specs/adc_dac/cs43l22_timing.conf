# Machine-readable mirror of specs/adc_dac/cs43l22.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the CS43L22's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the RESET pulse and the
# RESET-rising-edge-to-first-transaction delay involve a pin outside the
# I2C bus, the 100 us power-down wait ends with the removal of MCLK (also a
# pin), the volume ramps and zero-cross windows are internal behaviours,
# and the I2C limits are clock-rate/setup-hold properties. This file
# intentionally defines no checks.
