# Machine-readable mirror of specs/adc_dac/hx711.md's / specs/transport_hx711.md's
# Timing Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Power-down entry: PD_SCK held HIGH continuously for >60us. Measured
# directly from sigrok/hx711/pd.py's own "Power-down" annotation, whose
# (start, end) span already IS the measured high-time - the decoder itself
# only confirms power-down once PD_SCK has stayed HIGH for its 60us
# detection window, so there is no separate start/end event pair to look
# for here (see find_delta_samples()'s is_end=None case in
# _sigrok_conformance.py, the same mode WS2812B's reset_pulse check uses).
powerdown_pulse_min_us=60
powerdown_pulse_samplerate=1m
powerdown_pulse_capture_ms=200
