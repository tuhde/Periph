# SPI timing constraints (specs/adc_dac/ad7705.md, Timing Constraints):
# t3:  DRDY to CS setup time                       0 ns min
# t4:  CS falling to SCLK rising (read)             120 ns min
# t5:  SCLK falling to data valid                   100 ns max
# t6:  SCLK high pulse width                        100 ns min
# t7:  SCLK low pulse width                         100 ns min
# t8:  CS rising to SCLK rising hold time           0 ns min
# t9:  Bus relinquish time after SCLK rising       100 ns max
# t11: CS falling to SCLK rising (write)            120 ns min
# t12: Data valid to SCLK rising setup              30 ns min
# t13: Data valid to SCLK rising hold               20 ns min
# t14: SCLK high pulse width (write)                100 ns min
# t15: SCLK low pulse width (write)                 100 ns min
# t16: CS rising to SCLK rising hold (write)        0 ns min
