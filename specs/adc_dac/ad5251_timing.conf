# Machine-readable mirror of specs/adc_dac/ad5251.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the AD5251's timing constraints has a datasheet bound to check on the
# bus: the EEMEM store (about 26 ms) and restore (about 300 us) times are given
# as typical values only and completion is detected by ACK polling, and the I2C
# limits are clock-rate properties. This file intentionally defines no checks.
