# Machine-readable mirror of specs/adc_dac/ds3502.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the DS3502's stated timing constraints have a bus-decodable
# start/end annotation pair that the host must honour: the EEPROM write
# time (tW, 10-20 ms after the STOP of a write in MODE 0) is handled by the
# chip NACKing its address (acknowledge polling), the power-up memory recall
# delay (tD, 3 ms) is a power event, wiper settling (1 us) is analog, and
# the I2C limits are setup/hold and clock-rate properties. This file
# intentionally defines no checks.
