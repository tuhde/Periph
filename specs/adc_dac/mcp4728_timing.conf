# Machine-readable mirror of specs/adc_dac/mcp4728.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# EEPROM write time: 25 ms typical, 50 ms maximum. RDY/BSY is low during the
# write; any new write command is ignored until it returns high. Measured
# from a Single Write or Sequential Write command (both persist to EEPROM)
# to the next read observing RDY/BSY=1.
eeprom_write_time_max_ms=50
eeprom_write_time_samplerate=10k
eeprom_write_time_capture_ms=80
