# Machine-readable mirror of specs/adc_dac/mcp4532.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MCP4532's stated timing constraints have a bus-decodable
# start/end annotation pair that the host must honour: the wiper updates on
# the acknowledge of the command, the power-on delay (TBORD, 10-20 us) is a
# power event, and the I2C limits are setup/hold and clock-rate properties.
# This file intentionally defines no checks.
