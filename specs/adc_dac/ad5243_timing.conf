# Machine-readable mirror of specs/adc_dac/ad5243.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of AD5243's stated timing constraints have a bus-decodable start/end
# annotation pair to check against: wiper settling (1 us typ.) and power-up
# settling (5 us typ.) are analog behaviors with no digital completion event,
# and the I2C timing limits are clock-rate properties rather than
# event-to-event delays. This file intentionally defines no checks.
