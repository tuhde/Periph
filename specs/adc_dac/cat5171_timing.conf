# Machine-readable mirror of specs/adc_dac/cat5171.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to first transaction: >=1 ms (tPUR/tPUW) before the first I2C
# read or write. No dedicated power-sense channel exists in this repo's
# testconfig_wiring (only SCL/SDA are captured), so this is measured from
# capture start to the first decoded transaction - the operator is expected
# to power the board right as the capture begins (same pattern as
# specs/display/pcf8576_timing.conf).
poweron_ready_min_ms=1
poweron_ready_samplerate=100k
poweron_ready_capture_ms=50
