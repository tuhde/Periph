# Machine-readable mirror of specs/accelerometer/bma150.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Power-up to standby: <=3 ms typical before the first register access
# is guaranteed valid.
# Data refresh: registers update at 3 kHz (≈ 330 µs for T/X/Y/Z),
# independent of bandwidth. After a range change, allow 1/(2*bandwidth)
# for filtered data to replace stale registers.
# Wake-up from sleep: <=1.5 ms (1 ms typ.) after clearing CTRL.sleep
# until stable data (>99 %). Conformance-checked: sigrok annotation
# pair `wake_start` (write to CTRL 0x0A with sleep=0) → `wake_done`
# (next read starting at 0x02). See specs/accelerometer/bma150.md.
# Soft reset latency: 30 ms typical; bus access must wait at least 10 µs
# after the write; data valid after ~1.3 ms typical, up to 30 ms if
# issued while asleep. The driver waits 30 ms.
# New-data interrupt read-out: read within 20 µs of INT high (window
# 0..80 µs) to avoid conversion crosstalk. With I²C the read-out can
# exceed 330 µs, so the interrupt may not clear in time — prefer
# polling new_data_available() on I²C.
# I²C clock: 3.4 MHz max (high-speed mode); use <= 400 kHz on typical
# hosts. Setup time 20 ns min, hold 0 ns, etc.
# EEPROM: not used by the driver (30 ms per write, >= 14 ms between
# writes, >= 10 ms after sleep exit).
