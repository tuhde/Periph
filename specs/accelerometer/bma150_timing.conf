# Machine-readable mirror of specs/accelerometer/bma150.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# wake_up: from a CTRL (0x0A) write with sleep=0 (wake_start) to the next
# acceleration-data read starting at 0x02 (wake_done). Datasheet wake-up
# time is 1 ms typical, 1.5 ms maximum; allow 2 ms for bus + decode overhead.
wake_up_max_ms=2
wake_up_samplerate=1M
wake_up_capture_ms=20

# Informational only (no conformance check):
# Start-up from power-off: 3 ms typical.
# Soft reset: no serial transaction within 10 us after the write; data valid
# ~1.3 ms after, up to 30 ms if issued while asleep.
