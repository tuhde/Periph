# Machine-readable mirror of specs/accelerometer/mma8451q.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# first_data_ready: from a CTRL_REG1 (0x2A) write that sets ACTIVE=1
# (active_start) to the first STATUS (0x00) read with ZYXDR=1
# (active_ready). Default init is 100 Hz, whose STANDBY->ACTIVE turn-on
# time is 2/ODR + 1 ms = 21 ms (datasheet Table 3; power-down->ACTIVE is
# 2/ODR + 2 ms = 22 ms); allow 30 ms for bus + decode overhead.
first_data_ready_max_ms=30
first_data_ready_samplerate=10k
first_data_ready_capture_ms=200

# Informational only (no conformance check):
# I2C ready after power-up: 350 us typ, 500 us max.
# Software reset (RST): boot <= 0.5 ms.
