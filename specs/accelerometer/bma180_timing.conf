# Machine-readable mirror of specs/accelerometer/bma180.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# wake_up: from a CTRL_REG0 (0x0D) write with sleep=0 (wake_start) to the
# next acceleration-data read starting at 0x02 (wake_done). Datasheet
# wake-up time is < 2 ms; allow 3 ms for bus + decode overhead.
wake_up_max_ms=3
wake_up_samplerate=1M
wake_up_capture_ms=20

# Informational only (no conformance check):
# Start-up from power-off: < 3.5 ms.
# Soft reset (0xB6 to 0x10): no serial transaction within 10 us after the
# write; driver allows 30 ms.
