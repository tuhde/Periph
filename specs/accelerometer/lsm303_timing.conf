# Machine-readable mirror of specs/accelerometer/lsm303.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# first_data_ready: from a CTRL_REG1_A (0x20) write with ODR != 0000
# (odr_start) to the first STATUS_REG_A (0x27) read with ZYXDA=1
# (odr_ready). Default init is 100 Hz high-resolution mode, whose
# turn-on time is 7/ODR = 70 ms (datasheet Table 8); allow 80 ms for
# bus + decode overhead.
first_data_ready_max_ms=80
first_data_ready_samplerate=10k
first_data_ready_capture_ms=200

# Informational only (no conformance check):
# Boot: not stated for the DLHC; allow >= 5 ms.
# Turn-on: low-power 1 ms, normal / high-resolution 7/ODR.
# Magnetometer first data: not stated; wait one output period.
