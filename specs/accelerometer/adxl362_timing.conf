# Machine-readable mirror of specs/accelerometer/adxl362.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Power-up to standby: <=5 ms typical (100 Hz ODR, 50 Hz bandwidth test
# condition) before the first register access is guaranteed valid.
# Measurement-mode instruction to valid data: 4/ODR (e.g. 40 ms at 100 Hz,
# 320 ms at 12.5 Hz) after writing POWER_CTL.MEASURE=10.
# Soft reset latency: ~0.5 ms after writing 0x52 to SOFT_RESET before the
# device is ready for further commands.
# Self-test settle time: wait 4/ODR after asserting or deasserting
# SELF_TEST.ST before reading the updated acceleration data.
# Data-ready clear latency: up to 80 us delay between a data-register read
# (0x08-0x0A or 0x0E-0x15) and STATUS.DATA_READY clearing. Observable via
# the sigrok decoder's data_read_start/data_read_done annotation pair.
# SPI timing: clock 2.4 kHz-8 MHz (2.4 kHz floor applies only to FIFO
# reads); CS setup >=100 ns; CS hold >=20 ns; CS disable >=20 ns; data
# setup/hold >=20 ns each; clock high/low >=50 ns each; clock enable
# >=25 ns; output valid from clock low <=35 ns; output disable <=25 ns.
# External clock: 25.6 kHz-51.2 kHz (nominal internal clock is 51.2 kHz).
# External sample trigger (EXT_SAMPLE via INT2): active-high pulse width
# >=25 us; deasserted >=25 us between pulses; max trigger frequency 625 Hz
# typical.
# Power cycling (board-level, not firmware-controlled): VS/VDDIO must
# discharge to <=100 mV and remain below it for >=200 ms before
# re-powering; rise time from 0 V to 1.6 V must be <=600 us (or <=250 us
# in the worst case of V_RESET=100 mV / hold=200 ms).
