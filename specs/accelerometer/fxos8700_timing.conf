# Machine-readable mirror of specs/accelerometer/fxos8700.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# first_data_ready: from a CTRL_REG1 (0x2A) write that sets active=1
# (active_start) to the first STATUS (0x00) read with zyxdr=1
# (active_ready). Default init is hybrid mode at a 200 Hz system ODR
# (100 Hz per sensor): STANDBY->ACTIVE turn-on is 2/ODR + 1 ms = 11 ms
# (datasheet Table 6) plus one 10 ms hybrid sample period; allow 50 ms
# for bus + decode overhead.
first_data_ready_max_ms=50
first_data_ready_samplerate=10k
first_data_ready_capture_ms=200

# Informational only (no conformance check):
# Boot time after power-up / reset: <= 1000 us.
# ACTIVE -> STANDBY in mag-only / hybrid mode: 0..300 ms (poll SYSMOD).
