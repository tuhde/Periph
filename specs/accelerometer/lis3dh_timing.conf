# Machine-readable mirror of specs/accelerometer/lis3dh.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# first_data_ready: from a CTRL_REG1 (0x20) write with ODR != 0000
# (odr_start) to the first STATUS_REG (0x27) read with ZYXDA=1
# (odr_ready). Default init is 100 Hz high-resolution mode, whose
# turn-on time is 7/ODR = 70 ms (datasheet Table 10); allow 80 ms for
# bus + decode overhead.
first_data_ready_max_ms=80
first_data_ready_samplerate=10k
first_data_ready_capture_ms=200

# Informational only (no conformance check):
# Boot after power-up (and after a CTRL_REG5 BOOT write): ~5 ms.
# Turn-on: low-power 1 ms, normal 1.6 ms, high-resolution 7/ODR.
# Mode change: 1/ODR (towards lower resolution), 7/ODR (towards 12-bit).
# Self-test settle: 2 samples (low-power/normal), 8 samples (high-resolution).
