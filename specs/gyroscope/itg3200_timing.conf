# Machine-readable mirror of specs/gyroscope/itg3200.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the ITG-3200's timing constraints has a datasheet bound to check on
# the bus: the ZRO and PLL settling times are typical values with no bus-visible
# completion marker, the 20 ms register start-up is a supply event and the I2C
# limits are clock-rate properties. This file intentionally defines no checks.
