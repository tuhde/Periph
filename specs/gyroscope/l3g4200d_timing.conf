# Machine-readable mirror of specs/gyroscope/l3g4200d.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation", for the schema.

# first_data_ready: from CTRL_REG1 write with PD=1 (odr_start) to the
# first STATUS_REG read with ZYXDA=1 (odr_ready). The ODR period sets
# the upper bound: 100 Hz ODR → 10 ms, 200 Hz → 5 ms, etc. We pick
# 100 Hz as the worst case (longest period) for the conformance check.
first_data_ready_max_ms=15
first_data_ready_samplerate=10k
first_data_ready_capture_ms=50

# odr_cycle: from CTRL_REG1 write with PD=1 (odr_start) to the next
# STATUS_REG read with ZYXDA=1 (odr_next). At 100 Hz ODR, the period
# is 10 ms; allow up to 20 ms for bus + decode overhead.
odr_cycle_max_ms=20
odr_cycle_samplerate=10k
odr_cycle_capture_ms=50
