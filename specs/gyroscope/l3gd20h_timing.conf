# poweron_ready: from CTRL_REG1 write with PD=1 (poweron_start) to the
# first register read of any kind (poweron_ready). The datasheet
# specifies 250 ms power-on to stable data. Allow 300 ms to include
# bus overhead.
poweron_ready_max_ms=300
poweron_ready_samplerate=10k
poweron_ready_capture_ms=500