# Machine-readable mirror of specs/gyroscope/l3gd20h.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Power-on to stable data: from the CTRL_REG1 write that transitions
# PD 0->1 (power-down -> normal mode), the driver must wait >=250 ms
# before the first subsequent register read. Measured between the
# poweron_start and poweron_ready annotations.
poweron_ready_min_ms=250
poweron_ready_samplerate=10k
poweron_ready_capture_ms=300
