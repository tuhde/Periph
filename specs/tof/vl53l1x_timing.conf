# Machine-readable mirror of specs/tof/vl53l1x.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Single-shot ranging duration: from the SYSTEM__MODE_START (0x0087) = 0x10
# write to the STOP of the result-block read at 0x0089 that consumes it.
# Bounded by the timing budget (100 ms Minimal default, long distance mode);
# the upper bound allows host polling jitter and firmware overhead.
single_ranging_min_ms=80
single_ranging_max_ms=250
single_ranging_samplerate=1m
single_ranging_capture_ms=1000
