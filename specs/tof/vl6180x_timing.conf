# Machine-readable mirror of specs/tof/vl6180x.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the VL6180X's timing constraints has a datasheet bound to check on the
# bus: the range convergence times are typical values only (the sample is
# signalled by polling RESULT__INTERRUPT_STATUS_GPIO), the power-up time is a
# supply/CE event and the I2C limits are clock-rate properties. This file
# intentionally defines no checks.
