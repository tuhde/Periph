# Machine-readable mirror of specs/tof/vl53l0x.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Single-shot ranging duration: from the SYSRANGE_START (0x00) = 0x01 write
# on page 0 (outside a reference calibration, i.e. SYSTEM_SEQUENCE_CONFIG
# last written as 0xE8) to the STOP of the result-block read at 0x14 that
# consumes it. Datasheet section 3.6.2 / Figure 12: 33 ms per range at the
# default timing budget (23 ms measurement). Lower bound 20 ms = minimum
# timing budget; upper bound allows host polling jitter.
single_ranging_min_ms=20
single_ranging_max_ms=100
single_ranging_samplerate=1m
single_ranging_capture_ms=500
