# Machine-readable mirror of specs/humidity/htu31d.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the HTU31D's timing constraints has a datasheet maximum on a
# bus-decodable start/end annotation pair: the conversion times are typical
# values only, the power-up and soft-reset limits are not marked by a bus
# event, and the I2C limit is a clock-rate property. This file
# intentionally defines no checks.
