# Machine-readable mirror of specs/humidity/hs30xx.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the HS3xxx's stated timing constraints has a datasheet bound to
# check against on the bus: the measurement times are typical values (the
# sensor reports stale data via the status bits if fetched too early), the
# 10 ms programming-mode window and the NVM processing times are power /
# programming events, and the I2C limits are clock-rate properties. This
# file intentionally defines no checks.
