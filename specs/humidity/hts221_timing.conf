# Machine-readable mirror of specs/humidity/hts221.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the HTS221's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound to check against: the one-shot
# conversion time and the BOOT completion are signalled by self-clearing
# bits without a stated time, the ODR and the sensor response times are
# properties of the measurement, and the I2C limit is a clock-rate property.
# This file intentionally defines no checks.
