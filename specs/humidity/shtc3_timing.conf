# Machine-readable mirror of specs/humidity/shtc3.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SHTC3's stated timing constraints has a bus-decodable
# start/end annotation pair with a datasheet minimum to check against: the
# measurement duration is given only as typ./max. (10.8/12.1 ms normal,
# 0.7/0.8 ms low power) and the read before completion is simply NACKed,
# the power-up and soft-reset times are maxima (240 us) measured against
# supply or ACK events, and the I2C limits are clock-rate properties. This
# file intentionally defines no checks.
