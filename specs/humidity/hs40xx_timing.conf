# Machine-readable mirror of specs/humidity/hs40xx.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the HS40xx's stated timing constraints has a datasheet bound to
# check against on the bus: the conversion times are typical values (a
# no-hold read before completion is simply NACKed), the 500 ms soft-reset
# wait is a device-internal time, and the I2C limits are clock-rate
# properties. This file intentionally defines no checks.
