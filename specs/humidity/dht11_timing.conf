# Machine-readable mirror of specs/transport_dhtxx.md's Timing Constraints
# section (T_be - the host start signal). See specs/testing_framework.md,
# "Conformance Implementation".

# Host start signal: DATA driven LOW for 18-30ms before being released.
# Measured directly from sigrok/dhtxx/pd.py's own "Start: N ms" annotation,
# whose (start, end) span already IS the measured LOW time - the decoder
# only emits this annotation once the LOW pulse has ended, so there is no
# separate start/end event pair to look for here (see
# find_delta_samples()'s is_end=None case in _sigrok_conformance.py, the
# same mode WS2812B's reset_pulse and HX711's powerdown_pulse checks use).
start_signal_min_ms=18
start_signal_max_ms=30
start_signal_samplerate=1m
start_signal_capture_ms=50
