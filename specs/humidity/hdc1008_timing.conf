# Machine-readable mirror of specs/humidity/hdc1008.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the HDC1008's stated timing constraints has a datasheet bound to
# check against on the bus: the conversion times are given only as typical
# values (the read is NACKed until the result is ready), and the I2C limits
# are clock-rate properties. This file intentionally defines no checks.
