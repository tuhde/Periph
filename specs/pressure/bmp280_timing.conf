# Forced-mode conversion at the Minimal class's default Ultra Low Power
# preset (osrs_t=x1, osrs_p=x1): from the ctrl_meas write that triggers
# forced mode to the 6-byte data burst read, <= 6.4 ms max per the
# datasheet's forced-mode measurement-time table.
