# specs/pressure/lps33hw_timing.conf
# Machine-readable mirror of specs/pressure/lps33hw.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# ONE_SHOT conversion: from the CTRL_REG2 write that triggers ONE_SHOT to the
# STATUS read with both P_DA=1 and T_DA=1. At ODR=000 (power-down), the
# datasheet specifies the one-shot cycle completes in <1 ms; we bound it
# loosely to allow for scheduling jitter on the capturing host.
one_shot_conversion_max_ms=1.4
one_shot_conversion_samplerate=1m
one_shot_conversion_capture_ms=10