# Machine-readable mirror of specs/pressure/lps22hb.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the LPS22HB's stated timing constraints has a bus-decodable
# start/end annotation pair with a datasheet bound to check against: the
# one-shot conversion time is not specified, the boot and software-reset
# completion are signalled by self-clearing bits (no stated time), and the
# I2C/SPI limits are clock-rate properties. This file intentionally defines
# no checks.
