# Machine-readable mirror of specs/pressure/bmp180.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Temperature conversion (always 4.5 ms max, regardless of OSS): from the
# ctrl_meas write that triggers a temperature measurement to the UT read.
temp_conversion_max_ms=4.5
temp_conversion_samplerate=1m
temp_conversion_capture_ms=10

# Pressure conversion at the default OSS=0 (Ultra Low Power): from the
# ctrl_meas write that triggers a pressure measurement to the UP read.
# Different OSS settings have different max conversion times (7.5/13.5/
# 25.5 ms for OSS=1/2/3) - this check covers the Minimal class's default.
pressure_conversion_max_ms=4.5
pressure_conversion_samplerate=1m
pressure_conversion_capture_ms=10
