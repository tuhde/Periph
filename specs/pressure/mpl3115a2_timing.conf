# Machine-readable mirror of specs/pressure/mpl3115a2.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# One-shot conversion time at the driver's default oversample ratio of 128:
# from the CTRL_REG1 write that sets OST (conversion_start) to the first
# subsequent DR_STATUS/STATUS read with PTDR set (conversion_done). The
# datasheet's minimum time between data samples at OSR 128 is 512 ms; the
# checked minimum leaves 10 % for the unspecified tolerance.
conversion_done_min_us=460000
conversion_done_samplerate=100k
conversion_done_capture_ms=1500
