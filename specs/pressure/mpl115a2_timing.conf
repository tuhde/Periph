# Machine-readable mirror of specs/pressure/mpl115a2.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Conversion: from the write of the CONVERT register (0x12) to the first
# subsequent read of the ADC registers; the datasheet gives only a maximum
# conversion time (tc: 1.6 ms typ., 3 ms max) and no minimum, so the check
# bounds the driver's own wait: data must not be read later than the
# datasheet maximum plus the bus overhead of one read (5 ms). The checker
# fails a driver that waits longer than that.
conversion_done_max_ms=5
conversion_done_samplerate=1m
conversion_done_capture_ms=100
