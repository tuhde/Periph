# Machine-readable mirror of specs/pressure/spl06.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the SPL06-007's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the datasheet gives only
# typical/maximum measurement and power-up times that are polled through the
# `MEAS_CFG` ready flags, and the I²C limit is a clock-rate property, so
# there is no bus-decodable start/end annotation pair with a datasheet
# bound.
# This file intentionally defines no checks.
