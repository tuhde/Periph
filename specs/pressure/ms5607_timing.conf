# Machine-readable mirror of specs/pressure/ms5607.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MS5607's timing constraints has a bus-decodable start/end
# annotation pair to check against: the chip has no status register or
# interrupt, so the end of a conversion is not marked by any bus event (the
# host waits and then reads; an early read returns 0), the PROM reload after
# reset is likewise silent, and the I2C limit is a clock-rate property. This
# file intentionally defines no checks.
