# Machine-readable mirror of specs/memory/at24c02n.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Write cycle time: <= 5 ms from the STOP that ends a data write to the chip
# ACKing again (the datasheet's tWR, worst case over the supply range).
write_cycle_max_ms=5
write_cycle_samplerate=1m
write_cycle_capture_ms=20
