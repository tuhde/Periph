# Machine-readable mirror of specs/memory/24aa02uid.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Write cycle time (byte or page write): <= 5 ms (3 ms typical) from the
# STOP that ends a data write to the chip ACKing again - drivers must not
# issue the next command until ACK polling confirms the write cycle is
# complete (see the chip spec's "ACK Polling" section). Sampled fast enough
# to resolve individual I2C bus edges within that window.
write_cycle_max_ms=5
write_cycle_samplerate=1m
write_cycle_capture_ms=20
