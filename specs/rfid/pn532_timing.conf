# Machine-readable mirror of specs/rfid/pn532.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PN532's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the ACK and response times depend
# on the command and are polled via the status byte or the `IRQ` pin, the
# reset time is a pin event outside the I²C bus, and the I²C limit is a
# clock-rate property.
# This file intentionally defines no checks.
