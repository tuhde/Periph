# Machine-readable mirror of specs/rfid/mfrc522.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Oscillator/reset start-up: allow up to ~50 ms after SoftReset before the
# chip is guaranteed ready - poll CommandReg.PowerDown == 0 rather than a
# fixed sleep, per the spec.
reset_recovery_max_ms=50
reset_recovery_samplerate=1m
reset_recovery_capture_ms=60
