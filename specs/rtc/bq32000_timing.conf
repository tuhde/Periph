# Machine-readable mirror of specs/rtc/bq32000.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the BQ32000's stated timing constraints has a bus-decodable
# start/end annotation pair to check against: the 1 s timekeeping-register
# update after a backup-supply switchover and the 60 us post-backup I2C
# wait are supply events outside the bus, the calibration is a rate
# adjustment, and the I2C limits are clock-rate properties. This file
# intentionally defines no checks.
