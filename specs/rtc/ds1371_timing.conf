# Machine-readable mirror of specs/rtc/ds1371.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the DS1371's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the watchdog tick, the 250 ms
# interrupt pulse and the WDS strobe width are properties of the SQW/INT
# and WDS pins (not visible on the I²C bus), the oscillator-stop detection
# is an internal threshold, and the I²C limits are clock-rate properties.
# This file intentionally defines no checks.
