# Machine-readable mirror of specs/rtc/mcp7940n.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MCP7940N's stated timing constraints has a bus-decodable
# start/end annotation pair to check against: the oscillator start-up is
# signalled by the OSCRUN status bit without a datasheet bound, the backup
# switchover is a supply event, and the I2C limits are clock-rate
# properties. This file intentionally defines no checks.
