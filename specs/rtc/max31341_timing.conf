# None of the MAX31341's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the Set_RTC hold time and the
# oscillator start-up are host waits, the bus timeout and synchronisation
# delay are internal behaviours, and the I²C limits are clock-rate
# properties.
