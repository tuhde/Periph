# Machine-readable mirror of specs/rtc/pcf8563.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PCF8563's stated timing constraints has a bus-decodable
# start/end annotation pair to check against: the one-second access window
# for time register transfers is a bound on a single transaction, the
# oscillator start-up and the voltage-low detector are supply/oscillator
# events, and the I2C limits are clock-rate properties. This file
# intentionally defines no checks.
