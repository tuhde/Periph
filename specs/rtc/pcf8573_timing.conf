# Machine-readable mirror of specs/rtc/pcf8573.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PCF8573's timing constraints has a bus-visible start/done pair:
# the 4 ms COMP delay is referenced to the MIN pin edge, the thresholds are
# supply properties and the I2C limits are clock-rate properties. This file
# intentionally defines no checks.
