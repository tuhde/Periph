# Machine-readable mirror of specs/rtc/ds3231.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Temperature conversion: <=200 ms from the CONTROL register's CONV bit
# (bit 5) being written 1 until a CONTROL_STATUS read shows BSY (bit 2)
# clear. This is the only host-triggerable, bus-observable delay the chip
# has - everything else in the spec's Timing Constraints is either
# autonomous hardware behavior with no I2C signature, or generic I2C bus
# AC timing already covered by transport_i2c.md.
temp_conversion_ready_max_ms=200
temp_conversion_ready_samplerate=100k
temp_conversion_ready_capture_ms=250
