# Machine-readable mirror of specs/rtc/ds1307.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the DS1307's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the one-second time-register
# write window is satisfied by a single burst write, the oscillator
# start-up is a "usually less than one second" figure with no bus-visible
# end marker, and the I²C limits are clock-rate properties.
# This file intentionally defines no checks.
