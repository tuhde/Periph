# Machine-readable mirror of specs/rtc/pcf8523.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Time/date register access window: any single transaction that touches a
# register address in 0x03-0x09 (SECONDS through YEARS) must complete -
# START condition through the terminating STOP - within 1 s (datasheet
# Section 8.6.8 / Figure 14), or a pending 1 Hz increment can be lost.
# This is the only host-observable, conformance-checkable timing
# constraint the chip has - everything else in the spec's Timing
# Constraints is autonomous hardware behavior with no I2C signature.
time_access_max_ms=1000
time_access_samplerate=100k
time_access_capture_ms=1500
