# Machine-readable mirror of specs/comms/rda5807m.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# FM_READY settle (undocumented, measured on real hardware): after any
# register write, FM_READY deasserts and takes up to ~20 ms to reassert.
# Sampled fast enough to resolve individual I2C bus edges within the window.
ready_settle_max_ms=30
ready_settle_samplerate=1m
ready_settle_capture_ms=60

# Reset recovery (undocumented, measured on real hardware): after the
# SOFT_RESET pulse (or a standby re-enable write, which shares the same
# requirement), the chip needs >=200 ms before a subsequent TUNE will lock
# (STC observed). This driver's standby()/soft_reset() wait 250 ms for
# margin before retuning.
reset_recovery_min_ms=200
reset_recovery_samplerate=1m
reset_recovery_capture_ms=400
