# Machine-readable mirror of specs/comms/mcp2515.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# RESET to Configuration mode: ≥ 2 µs after the SPI RESET command before
# issuing further SPI transactions. Checked against the SPI bus: the
# RESET byte (0xC0) marks the start; the next CS assertion (any
# instruction byte) marks the end.
reset_to_config_min_us=2
reset_to_config_samplerate=24m
reset_to_config_capture_ms=10

# Mode transition: after writing CANCTRL REQOP, poll CANSTAT until
# OPMOD matches. Typical < 1 ms per datasheet.
mode_transition_max_ms=2
mode_transition_samplerate=24m
mode_transition_capture_ms=10
