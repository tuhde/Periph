# Machine-readable mirror of specs/color/as7262.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# conversion: <= 350 ms from the virtual write of CONTROL_SETUP with
# BANK = 11 (one-shot) at the Minimal default INT_T = 0x3B (59 x 2.8 ms) to the
# first virtual read of CONTROL_SETUP with DATA_RDY = 1 (2 x 165.2 ms = 330.4 ms,
# rounded up with margin for the I2C handshake).
conversion_max_ms=350
conversion_samplerate=100k
conversion_capture_ms=600
