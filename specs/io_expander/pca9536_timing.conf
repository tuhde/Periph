# Machine-readable mirror of specs/io_expander/pca9536.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".
#
# None of the PCA9536's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the chip has no RESET or INT
# pin, the port output timing is pin-level, and the I2C limits are
# setup/hold and clock-rate properties rather than event-to-event delays. This file intentionally
# defines no checks.
