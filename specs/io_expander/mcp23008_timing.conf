# Machine-readable mirror of specs/io_expander/mcp23008.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".
#
# None of the MCP23008 / MCP23S08's stated timing constraints have a
# bus-decodable start/end annotation pair to check against: the I2C and SPI
# limits are setup/hold and clock-rate properties rather than
# event-to-event delays, the RESET pulse is an external-pin event outside the
# bus, and there is no startup delay. This file intentionally defines no
# checks.
