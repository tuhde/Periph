# Machine-readable mirror of specs/io_expander/pcf8575.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# At 400 kHz, a full 2-byte read takes approximately 45 us. The named
# annotation pair below (see sigrok/pcf8575/pd.py) marks the bus
# transaction itself (ADDRESS READ through STOP).
read_cycle_max_us=45
read_cycle_samplerate=4m
read_cycle_capture_ms=300
