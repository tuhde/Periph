# Machine-readable mirror of specs/io_expander/pca6408a.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".
#
# None of the PCA6408A's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the RESET pulse and reset
# recovery are pin-level events outside the I2C/SMBus bus, INT and port
# timings are pin-to-pin, and the I2C limits are setup/hold and clock-rate
# properties rather than event-to-event delays. This file intentionally
# defines no checks.
