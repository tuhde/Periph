# Machine-readable mirror of specs/io_expander/pcf8574.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# INT clears within one read transaction: approximately 90 us at 100 kHz.
# The named annotation pair below (see sigrok/pcf8574/pd.py) marks the bus
# transaction itself (ADDRESS READ through STOP) rather than the INT line
# (no INT channel is captured by default — only SCL/SDA), so this is a
# reasonable proxy: any I2C read clears INT, and the read transaction's own
# duration bounds how soon that happens.
read_cycle_max_us=90
read_cycle_samplerate=4m
read_cycle_capture_ms=300
