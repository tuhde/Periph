# Machine-readable mirror of specs/io_expander/mcp23017.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Single-register read (address phase + read): approximately 30-40 us at
# 400 kHz bus clock. The named annotation pair below (see
# sigrok/mcp23017/pd.py) marks only the read phase itself (repeated-start
# ADDRESS READ through the terminating STOP), which is a subset of the
# full address+read transaction the spec quotes — so this bound stays a
# safe (if slightly loose) upper bound rather than an invented number.
register_read_cycle_max_us=40
register_read_cycle_samplerate=4m
register_read_cycle_capture_ms=300
