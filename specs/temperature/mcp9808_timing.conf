# Machine-readable mirror of specs/temperature/mcp9808.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Register access cycle: a single register read or write (START, address,
# pointer byte, data, STOP) at 400 kHz. This is the only host-observable,
# conformance-checkable timing constraint the chip has - temperature
# conversion runs continuously and autonomously with no start/busy bit to
# bound a start/end pair against, and the bus time-out is a fault-recovery
# behavior, not something the driver triggers intentionally.
register_access_max_us=150
register_access_samplerate=4m
register_access_capture_ms=300
