# Machine-readable mirror of specs/temperature/stds75.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# The STDS75 converts continuously: there is no start/done marker on the bus
# (no one-shot, no status flag), the conversion times are maxima for the
# selected resolution without a bus-visible event, and the I2C limits are
# clock-rate properties. This file intentionally defines no checks.
