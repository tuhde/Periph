# Machine-readable mirror of specs/temperature/mlx90614.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the MLX90614's timing constraints has a datasheet bound with a
# bus-visible start/done pair: Tvalid and the wake-up time are supply/host-side
# events, the 5 ms EEPROM cell times have no completion marker other than
# polling the EEBUSY flag, and the SMBus limits are clock-rate properties. This
# file intentionally defines no checks.
