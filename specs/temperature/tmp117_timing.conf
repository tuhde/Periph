# Machine-readable mirror of specs/temperature/tmp117.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# EEPROM write ready: after writing an EEPROM-backed register while EUN=1,
# EEPROM_Busy clears within ~7 ms typical (no datasheet-specified maximum;
# this spec budgets 20 ms as a conservative bound). This is the only
# host-observable, conformance-checkable timing constraint the chip has -
# conversion timing runs continuously and autonomously with no start/busy
# bit to bound a start/end pair against, and the bus time-out is a
# fault-recovery behavior, not something the driver triggers intentionally.
eeprom_write_ready_max_ms=20
eeprom_write_ready_samplerate=100k
eeprom_write_ready_capture_ms=50
