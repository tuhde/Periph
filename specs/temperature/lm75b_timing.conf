# Machine-readable mirror of specs/temperature/lm75b.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the LM75B's stated timing constraints have a bus-decodable
# start/end annotation pair to check against: the 100 ms conversion period
# and 10 ms conversion time are internal and end without a bus event (the
# Temp register is simply updated), the bus time-out is a failure mode, and
# the I2C limits are clock-rate properties. This file intentionally defines
# no checks.
