# Machine-readable mirror of specs/gnss/neo-6.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to first NMEA output: >=100ms module boot time. No dedicated
# power-sense channel exists in this repo's testconfig_wiring (only the
# UART RX line is captured), so this is measured from capture start to
# the first decoded NMEA/UBX sentence - the operator is expected to power
# the module right as the capture begins, the same convention AHT21's
# poweron_ready check uses (see find_delta_samples()'s is_start=None case
# in _sigrok_conformance.py).
poweron_ready_min_ms=100
poweron_ready_samplerate=1m
poweron_ready_capture_ms=2000
