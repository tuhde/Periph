# Machine-readable mirror of specs/environmental/aht21.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Trigger to data ready: >=80 ms from the "Trigger Measurement" (0xAC)
# command write until a status read shows the busy bit (bit 7) clear.
measurement_trigger_min_ms=80
measurement_trigger_samplerate=1m
measurement_trigger_capture_ms=120

# Power-on to ready: >=100 ms. No dedicated power-sense channel exists in
# this repo's testconfig_wiring, so the checker measures from capture start
# (the operator is expected to power the board right as the capture begins)
# to the first successful bus transaction - see aht21_conformance.py.
poweron_ready_min_ms=100
poweron_ready_samplerate=10k
poweron_ready_capture_ms=150
