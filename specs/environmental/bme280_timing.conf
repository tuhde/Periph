# specs/environmental/bme280_timing.conf
# measurement_trigger: from the ctrl_meas write that sets mode=Forced to the
# ADC data burst read (0xF7, 8 bytes), bounded by the weather-monitoring
# preset's max measurement time (osrs_t=x1, osrs_p=x1, osrs_h=x1: 9.3 ms max
# per spec Timing Constraints table).
measurement_trigger_min_ms=1
measurement_trigger_max_ms=20
measurement_trigger_samplerate=1m
measurement_trigger_capture_ms=100
