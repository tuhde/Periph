# Machine-readable mirror of specs/environmental/bme688.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the BME688's stated timing constraints has a bus-decodable
# start/end annotation pair with a datasheet bound to check against: the
# TPHG cycle length depends on the oversampling and heater settings and is
# signalled only by the measuring / new_data status bits (no fixed minimum is
# stated), the 2 ms start-up is a power event, and the I2C limits are
# clock-rate properties. This file intentionally defines no checks.
