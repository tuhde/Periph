# Trigger to data ready: >80 ms from the "Trigger Measurement" (0xAC)
# command write (measurement_start) until a status read shows the busy bit
# (bit 7) clear (measurement_done).
measurement_done_min_ms=80
measurement_done_samplerate=1m
measurement_done_capture_ms=120
