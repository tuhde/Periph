# specs/environmental/bme680_timing.conf
# measurement_trigger: from the ctrl_meas write that sets mode=Forced to the
# ADC data burst read (0x1F, 13 bytes) - the driver's per-call forced TPHG
# cycle. Bound generously to cover default settings (~190 ms total: TPH max
# + 150 ms heater + ~15 ms gas measurement, per spec Timing Constraints).
measurement_trigger_min_ms=5
measurement_trigger_max_ms=300
measurement_trigger_samplerate=100k
measurement_trigger_capture_ms=500
