# Machine-readable mirror of specs/environmental/am2320.md's Timing
# Constraints section. See specs/testing_framework.md, "Conformance
# Implementation".

# Command to read: >= 1.5 ms between the end of the 0x03 read-command write
# (read_delay_start) and the following read address byte (read_delay_done).
# The driver reads at most once per 2 s, so the capture window covers one
# full wake / command / read cycle.
read_delay_done_min_us=1500
read_delay_done_samplerate=500k
read_delay_done_capture_ms=3000
