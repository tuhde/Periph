# Machine-readable mirror of specs/led/pca9685.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the PCA9685's timing constraints has a bus-decodable start/end
# annotation pair with a datasheet bound: the PCA9685's outputs are free-
# running PWM; the only timing limits are the 500 µs oscillator start-up
# after `SLEEP` is cleared and the datasheet's 1 MHz I²C clock, which are
# host waits and a clock-rate property with no bus-decodable end event.
# This file intentionally defines no checks.
