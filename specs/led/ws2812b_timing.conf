# Reset pulse (RES): >=50us low between transmissions. Measured directly
# from the neopixel transport decoder's own "reset" annotation, whose
# (start, end) span already IS the measured pulse width - no separate
# start/end event pair to look for (see find_delta_samples()'s is_end=None
# case in _sigrok_conformance.py).
reset_pulse_min_us=50
reset_pulse_samplerate=1m
reset_pulse_capture_ms=5
