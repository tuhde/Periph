# Machine-readable mirror of specs/led/ws2814.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Reset pulse (RES): >=280us low between transmissions (longer than
# SK6812RGBW's 80us and WS2812B's 50us). Measured directly from the
# neopixel connection decoder's own "reset" annotation, whose (start, end)
# span already IS the measured pulse width - no separate start/end event
# pair to look for (see find_delta_samples()'s is_end=None case in
# _sigrok_conformance.py).
reset_pulse_min_us=280
reset_pulse_samplerate=1m
reset_pulse_capture_ms=5
