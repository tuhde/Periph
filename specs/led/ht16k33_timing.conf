# Machine-readable mirror of specs/led/ht16k33.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Power-on to first transaction: >=1 ms after power-up the I2C bus should be
# idle (reset action). No dedicated power-sense channel exists in this repo's
# testconfig_wiring (only SCL/SDA are captured), so this is measured from
# capture start to the first decoded transaction - the operator is expected
# to power the board right as the capture begins (same pattern as the
# pcf8576's and aht21's poweron_ready checks).
poweron_ready_min_ms=1
poweron_ready_samplerate=100k
poweron_ready_capture_ms=50
