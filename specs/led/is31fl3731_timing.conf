# Machine-readable mirror of specs/led/is31fl3731.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".
#
# None of the IS31FL3731's timing constraints have a bus-decodable start/end
# annotation pair to check against: the auto-play delay, blink, breath and
# audio timings are internal to the chip and only visible at the LED
# outputs, the INTB pulse is a pin event outside the I2C bus, and the I2C
# limit is a clock-rate property. This file intentionally defines no checks.
