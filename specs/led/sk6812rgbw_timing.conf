# Machine-readable mirror of specs/led/sk6812rgbw.md's Timing Constraints
# section. See specs/testing_framework.md, "Conformance Implementation".

# Reset pulse (RES): >=80us low between transmissions (longer than
# WS2812B's 50us). Measured directly from the neopixel transport decoder's
# own "reset" annotation, whose (start, end) span already IS the measured
# pulse width - no separate start/end event pair to look for (see
# find_delta_samples()'s is_end=None case in _sigrok_conformance.py).
reset_pulse_min_us=80
reset_pulse_samplerate=1m
reset_pulse_capture_ms=5
