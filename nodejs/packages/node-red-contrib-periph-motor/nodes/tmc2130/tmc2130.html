<script type="text/html" data-help-name="periph-tmc2130">
    <p>Drives a two-phase bipolar stepper motor through a Trinamic TMC2130 over SPI (Mode 3). The chip has no internal step generator, so the node pulses the STEP and DIR GPIOs; moves are blocking.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.move <span class="property-type">number</span></dt>
        <dd>Full steps to move; negative = reverse. Blocks until finished.</dd>
        <dt>payload.speed <span class="property-type">number</span></dt>
        <dd>Speed in full steps per second for <code>move</code>; defaults to the configured speed.</dd>
        <dt>payload.current <span class="property-type">number</span></dt>
        <dd>Run current in A RMS (at most 1.4); hold current becomes one third of it.</dd>
        <dt>payload.microsteps <span class="property-type">number</span></dt>
        <dd>Microstep resolution: 1, 2, 4, 8, 16, 32, 64, 128 or 256.</dd>
        <dt>payload.stall_threshold <span class="property-type">number</span></dt>
        <dd>StallGuard2 threshold <code>sgt</code> −64…63; lower is more sensitive.</dd>
        <dt>payload.spreadcycle <span class="property-type">boolean</span></dt>
        <dd><code>true</code> selects SpreadCycle only (needed for StallGuard2), <code>false</code> StealthChop.</dd>
        <dt>payload.enable <span class="property-type">boolean</span></dt>
        <dd><code>true</code> switches the power stage on, <code>false</code> off (the motor freewheels).</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any other message polls the driver status.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.standstill <span class="property-type">boolean</span></dt>
        <dd>The motor is at standstill.</dd>
        <dt>payload.fault <span class="property-type">number</span></dt>
        <dd>Fault bitmask: 1 over-temperature pre-warning, 2 over-temperature, 4 short to GND, 16 open load (informative only); <code>0</code> = none.</dd>
        <dt>payload.cs_actual <span class="property-type">number</span></dt>
        <dd>Actual current scale 0–31.</dd>
        <dt>payload.sg_result <span class="property-type">number</span></dt>
        <dd>StallGuard2 result 0–1023 (0 = highest load).</dd>
        <dt>payload.tstep, stallguard, otpw, ot</dt>
        <dd>Status polls only: time between microsteps, stall flag, over-temperature pre-warning and shutdown flags.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Connect the chip to the SPI bus (SPI_MODE pin high, SCK idles high) and set the bus and device numbers (<code>/dev/spidevB.D</code>). STEP and DIR GPIOs are given as <code>chip:line</code> (e.g. <code>0:27</code>, needs the <code>opengpio</code> package); the optional ENN GPIO drives the enable pin, otherwise the node switches the power stage through the chopper (<code>TOFF</code>). Set the external sense resistor value (0.11 Ω on common boards) and the default current, microsteps and speed applied at start. The driver is disabled when the node is closed.</p>
</script>
