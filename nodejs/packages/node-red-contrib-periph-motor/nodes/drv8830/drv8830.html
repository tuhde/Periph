<script type="text/html" data-template-name="periph-drv8830">

<script type="text/html" data-help-name="periph-drv8830">
    <p>Drives a brushed DC motor through a DRV8830 low-voltage H-bridge over I²C, and reports its fault status. The chip regulates the commanded <em>voltage</em> across the motor, so speed stays constant as the supply sags.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.voltage <span class="property-type">number</span></dt>
        <dd>Signed target voltage in V: positive = forward, negative = reverse, <code>0</code> = coast. Usable range 0.48–5.06 V; smaller magnitudes coast, larger ones are clamped.</dd>
        <dt>payload.brake <span class="property-type">boolean</span></dt>
        <dd><code>true</code> short-brakes the motor.</dd>
        <dt>payload.stop <span class="property-type">boolean</span></dt>
        <dd><code>true</code> puts the bridge in standby (coast).</dd>
        <dt>payload.clear_fault <span class="property-type">boolean</span></dt>
        <dd><code>true</code> clears the fault register, re-enabling a bridge latched off by an overcurrent or current-limit fault.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any other message reads the fault register and emits it (the fault is not cleared).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.fault <span class="property-type">boolean</span></dt>
        <dd>Any fault condition exists.</dd>
        <dt>payload.ocp / uvlo / ots / ilimit <span class="property-type">boolean</span></dt>
        <dd>Fault source: overcurrent, undervoltage lockout, overtemperature, extended current limit.</dd>
    </dl>
    <p>Command messages (<code>voltage</code>, <code>brake</code>, <code>stop</code>, <code>clear_fault</code>) produce no output.</p>

    <h3>Configuration</h3>
    <p>Set the Linux I²C bus number and pick the device address (0x60–0x68) matching the board's A0/A1 strapping — it is fixed in hardware and cannot be probed. The motor is put in coast when the node is closed.</p>
</script>
