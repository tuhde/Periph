<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('saa1064-device', {
        category: 'config',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '38', required: true },
            current: { value: '12', required: true },
            mode:    { value: 'dynamic', required: true }
        },
        label: function() {
            return this.name || ('SAA1064 @ 0x' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="saa1064-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="SAA1064">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address">I²C address (hex)</label>
        <input type="text" id="node-config-input-address" style="width:80px" placeholder="38"> &nbsp;(38–3B)
    </div>
    <div class="form-row">
        <label for="node-config-input-current">Segment current (mA)</label>
        <select id="node-config-input-current" style="width:100px">
            <option value="0">0</option><option value="3">3</option><option value="6">6</option>
            <option value="9">9</option><option value="12">12</option><option value="15">15</option>
            <option value="18">18</option><option value="21">21</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-mode">Mode</label>
        <select id="node-config-input-mode" style="width:100px">
            <option value="dynamic">dynamic</option>
            <option value="static">static</option>
        </select>
    </div>
</script>

<!-- Node: show a number, digits, raw segments, current or test -->
<script type="text/javascript">
    RED.nodes.registerType('saa1064', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'saa1064-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-th',
        label:   function() { return this.name || 'SAA1064'; },
        paletteLabel: 'SAA1064'
    });
</script>

<script type="text/html" data-template-name="saa1064">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
</script>

<script type="text/html" data-help-name="saa1064">
    <p>Drives a 4-digit 7-segment display through an SAA1064 over I²C.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number | string</span></dt>
        <dd>A number 0–9999 (right-aligned), or a 4-character string of digits and spaces.</dd>
        <dt>payload.raw <span class="property-type">array</span></dt>
        <dd>Raw segment bytes for digits 1–4 (1–4 values).</dd>
        <dt>payload.current <span class="property-type">number</span></dt>
        <dd>Segment current in mA: 0, 3, 6, 9, 12, 15, 18 or 21.</dd>
        <dt>payload.test <span class="property-type">boolean</span></dt>
        <dd>Switch the segment test on or off.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The applied fields: <code>{ number }</code>, <code>{ digits }</code>, <code>{ raw }</code>, <code>{ current }</code> and/or <code>{ test }</code>.</dd>
    </dl>
    <h3>Configuration</h3>
    <p>I²C bus number, address in hex (default 38), the initial segment current and the multiplex mode.</p>
</script>
