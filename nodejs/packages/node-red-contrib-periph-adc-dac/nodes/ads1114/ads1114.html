<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('ads1114-device', {
        category: 'config',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '48', required: true },
            gain:    { value: '2' },
            dataRate: { value: '4' }
        },
        label: function() {
            return this.name || ('ADS1114 @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="ads1114-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="ADS1114">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address">Address (hex)</label>
        <input type="text" id="node-config-input-address" placeholder="48" style="width:80px"> &nbsp;48–4B (ADDR strap), default 48
    </div>
    <div class="form-row">
        <label for="node-config-input-gain"><i class="fa fa-cog"></i> Gain</label>
        <select id="node-config-input-gain" style="width:140px">
            <option value="0">±6.144 V</option>
            <option value="1">±4.096 V</option>
            <option value="2">±2.048 V</option>
            <option value="3">±1.024 V</option>
            <option value="4">±0.512 V</option>
            <option value="5">±0.256 V</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-dataRate"><i class="fa fa-clock-o"></i> Data rate</label>
        <select id="node-config-input-dataRate" style="width:140px">
            <option value="0">8 SPS</option>
            <option value="1">16 SPS</option>
            <option value="2">32 SPS</option>
            <option value="3">64 SPS</option>
            <option value="4">128 SPS</option>
            <option value="5">250 SPS</option>
            <option value="6">475 SPS</option>
            <option value="7">860 SPS</option>
        </select>
    </div>
</script>

<!-- Read node -->
<script type="text/javascript">
    RED.nodes.registerType('ads1114', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:    { value: '' },
            device: { value: '', type: 'ads1114-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-microchip',
        label:   function() { return this.name || 'ADS1114'; },
        paletteLabel: 'ADS1114'
    });
</script>

<script type="text/html" data-template-name="ads1114">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="ADS1114">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
</script>

<script type="text/html" data-help-name="ads1114">
    <p>Reads the ADS1114 16-bit ΔΣ ADC (one differential input (AIN0 − AIN1) with programmable gain) over I²C. Default address is <code>0x48</code>; <code>0x48</code>–<code>0x4B</code> are valid depending on the ADDR strap.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers a single-shot conversion.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.raw <span class="property-type">number</span></dt>
        <dd>Signed 16-bit conversion code.</dd>
        <dt>payload.voltage <span class="property-type">number</span></dt>
        <dd>Input voltage in volts (raw × LSB of the configured range).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>I²C bus and address, gain (full-scale range), data rate.</p>
</script>
