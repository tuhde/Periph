<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('mcp4xxx-device', {
        category: 'config',
        defaults: {
            name:     { value: '' },
            part:     { value: 'MCP4532', required: true },
            bus:      { value: '1', required: true, validate: RED.validators.number() },
            address:  { value: '58', required: true, validate: RED.validators.regex(/^[0-9a-fA-F]{1,2}$/) },
            rab:      { value: '10000', required: true, validate: RED.validators.number() },
            rwiper:   { value: '75', required: true, validate: RED.validators.number() },
            gpioChip: { value: '0' },
            hvcPin:   { value: '' }
        },
        label: function() {
            return this.name || (this.part + ' @ 0x' + this.address + ' (bus ' + this.bus + ')');
        },
        oneditprepare: function() {
            // Part digits "4 S M P": S = 5 single / 6 dual, M = 3/5 volatile, 4/6 non-volatile, P = 1 pot / 2 rheostat.
            // The address range follows the part: 45X1 0x2E-0x2F, 45X2 / 46X2 0x58-0x5B, 46X1 0x28-0x2F.
            function fill() {
                const d = $('#node-config-input-part').val().slice(3);
                const dual = d[1] === '6';
                const nv = d[2] === '4' || d[2] === '6';
                const pot = d[3] === '1';
                const lo = pot ? (dual ? 0x28 : 0x2E) : 0x58;
                const hi = pot ? 0x2F : 0x5B;
                const sel = $('#node-config-input-address');
                const cur = parseInt(sel.val() || '0', 16);
                sel.empty();
                for (let a = lo; a <= hi; a++) sel.append($('<option>').val(a.toString(16).toUpperCase()).text('0x' + a.toString(16).toUpperCase()));
                sel.val((cur >= lo && cur <= hi ? cur : lo).toString(16).toUpperCase());
                $('#mcp4xxx-hvc-row').toggle(nv);
            }
            $('#node-config-input-part').on('change', fill);
            fill();
        }
    });
</script>

<script type="text/html" data-help-name="periph-mcp4xxx">
    <p>Sets or reads the volatile wiper(s) of an MCP4XXX I²C digital potentiometer / rheostat
    (MCP4531 … MCP4662: 7 / 8-bit, one or two networks, volatile or non-volatile). The device is
    configured via an <b>mcp4xxx-device</b> config node.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.channel <span class="property-type">number</span></dt>
        <dd>Network 0 (default) or 1 (dual parts).</dd>
        <dt>payload.code <span class="property-type">number</span></dt>
        <dd>Wiper position 0–128 (7-bit parts) / 0–256 (8-bit parts). Takes precedence over the other set fields.</dd>
        <dt>payload.ohms <span class="property-type">number</span></dt>
        <dd>Target wiper-to-B resistance in ohms; the nearest reachable code is used.</dd>
        <dt>payload.ratio <span class="property-type">number</span></dt>
        <dd>Divider ratio 0–1.</dd>
        <dt>payload.step <span class="property-type">number</span></dt>
        <dd>Increment (positive) or decrement (negative) the wiper by that many steps.</dd>
        <dt>payload.shutdown <span class="property-type">boolean</span></dt>
        <dd><code>true</code> shuts the network down (A open, W tied to B), <code>false</code> resumes.</dd>
        <dt>payload.store <span class="property-type">boolean</span></dt>
        <dd>Non-volatile parts: store the current wiper in the EEPROM wiper.</dd>
        <dt>payload.data <span class="property-type">object</span></dt>
        <dd>Non-volatile parts: <code>{ index: 0-9, value?: 0-511 }</code> reads (and, with <code>value</code>, writes) a general-purpose EEPROM register.</dd>
    </dl>
    <p>Any other message reads back all networks.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.channel, payload.code, payload.resistance</dt>
        <dd>After a write: the network, the resulting wiper code and its W–B resistance (Ω); plus
        <code>shutdown</code> / <code>stored</code> where requested.</dd>
        <dt>payload.index, payload.value</dt>
        <dd>After an EEPROM data access.</dd>
        <dt>payload.wiper, payload.resistance <span class="property-type">array</span></dt>
        <dd>After a read: one entry per network; non-volatile parts also return <code>payload.status</code>
        (<code>eepromBusy</code>, <code>wiperLock</code>, <code>writeProtect</code>).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Choose the part, I²C bus and address (limited to the part's range), the end-to-end resistance RAB
    (5 / 10 / 50 / 100 kΩ) and the wiper resistance RW. Volatile wipers return to mid-scale at power-up;
    non-volatile parts restore the stored EEPROM wiper. The optional HVC GPIO (non-volatile parts) drives the
    external high-voltage circuit needed for WiperLock / write-protect changes.</p>
</script>
