<script type="text/javascript">
    RED.nodes.registerType('periph-ads1013', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:     { value: '' },
            bus:      { value: '1', required: true, validate: RED.validators.number() },
            address:  { value: '0x48' },
            dataRate: { value: '4' }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-tachometer',
        label:   function() { return this.name || 'ADS1013'; },
        paletteLabel: 'ADS1013'
    });
</script>

<script type="text/html" data-template-name="periph-ads1013">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="ADS1013">
    </div>
    <div class="form-row">
        <label for="node-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-input-address"><i class="fa fa-map-marker"></i> I²C address</label>
        <select id="node-input-address" style="width:120px">
            <option value="0x48">0x48 (ADDR = GND)</option>
            <option value="0x49">0x49 (ADDR = VDD)</option>
            <option value="0x4A">0x4A (ADDR = SDA)</option>
            <option value="0x4B">0x4B (ADDR = SCL)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-dataRate"><i class="fa fa-clock-o"></i> Data rate</label>
        <select id="node-input-dataRate" style="width:160px">
            <option value="0">128 SPS</option>
            <option value="1">250 SPS</option>
            <option value="2">490 SPS</option>
            <option value="3">920 SPS</option>
            <option value="4">1600 SPS</option>
            <option value="5">2400 SPS</option>
            <option value="6">3300 SPS</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="periph-ads1013">
    <p>Reads the voltage AIN0 − AIN1 from an ADS1013 12-bit ADC over I²C using a single-shot conversion.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers one single-shot conversion.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.raw <span class="property-type">number</span></dt>
        <dd>12-bit two's-complement conversion code, −2048…2047.</dd>
        <dt>payload.voltage <span class="property-type">number</span></dt>
        <dd>Voltage AIN0 − AIN1 in volts (<code>raw × 0.001</code>).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the I²C bus number and the address selected by the ADDR strap (<code>0x48</code>–<code>0x4B</code>) and the data rate (128–3300 SPS). The range is fixed at ±2.048 V. Wire AIN1 to GND for a single-ended measurement.</p>
</script>
