<script type="text/javascript">
    RED.nodes.registerType('periph-ads1113', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '48', required: true },
            dataRate: { value: '4' }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-microchip',
        label:   function() { return this.name || 'ADS1113'; },
        paletteLabel: 'ADS1113'
    });
</script>

<script type="text/html" data-template-name="periph-ads1113">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="ADS1113">
    </div>
    <div class="form-row">
        <label for="node-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-input-address">Address (hex)</label>
        <input type="text" id="node-input-address" placeholder="48" style="width:80px"> &nbsp;48–4B (ADDR strap), default 48
    </div>
    <div class="form-row">
        <label for="node-input-dataRate"><i class="fa fa-clock-o"></i> Data rate</label>
        <select id="node-input-dataRate" style="width:140px">
            <option value="0">8 SPS</option>
            <option value="1">16 SPS</option>
            <option value="2">32 SPS</option>
            <option value="3">64 SPS</option>
            <option value="4">128 SPS</option>
            <option value="5">250 SPS</option>
            <option value="6">475 SPS</option>
            <option value="7">860 SPS</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="periph-ads1113">
    <p>Reads the ADS1113 16-bit ΔΣ ADC (one differential input (AIN0 − AIN1), fixed ±2.048 V) over I²C. Default address is <code>0x48</code>; <code>0x48</code>–<code>0x4B</code> are valid depending on the ADDR strap.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers a single-shot conversion.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.raw <span class="property-type">number</span></dt>
        <dd>Signed 16-bit conversion code.</dd>
        <dt>payload.voltage <span class="property-type">number</span></dt>
        <dd>Input voltage in volts (raw × LSB of the configured range).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>I²C bus and address, data rate.</p>
</script>
