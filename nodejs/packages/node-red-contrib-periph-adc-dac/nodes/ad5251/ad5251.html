<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('ad5251-device', {
        category: 'config',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '0x2C', required: true },
            rab:     { value: '50000', required: true },
            rwiper:  { value: '75', required: true, validate: RED.validators.number() }
        },
        label: function() {
            return this.name || ('AD5251 @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="ad5251-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="AD5251">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label><i class="fa fa-at"></i> I²C address</label>
        <select id="node-config-input-address" style="width:100px">
            <option value="0x2C">0x2C</option>
            <option value="0x2D">0x2D</option>
            <option value="0x2E">0x2E</option>
            <option value="0x2F">0x2F</option>
        </select> &nbsp;(AD1, AD0 pins)
    </div>
    <div class="form-row">
        <label for="node-config-input-rab"><i class="fa fa-sliders"></i> RAB</label>
        <select id="node-config-input-rab" style="width:120px">
            <option value="50000">50 kΩ</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-rwiper"><i class="fa fa-sliders"></i> Wiper RW</label>
        <input type="number" id="node-config-input-rwiper" min="0" style="width:80px"> &nbsp;Ω (typ. 75 Ω)
    </div>
</script>

<!-- Read node -->
<script type="text/javascript">
    RED.nodes.registerType('ad5251', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:    { value: '' },
            device: { value: '', type: 'ad5251-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-sliders',
        label:   function() { return this.name || 'AD5251'; },
        paletteLabel: 'AD5251'
    });
</script>

<script type="text/html" data-template-name="ad5251">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="AD5251">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
</script>

<script type="text/html" data-help-name="ad5251">
    <p>Sets and reads the two 64-position wipers of an AD5251 dual I²C digital potentiometer. Both channels power up from their stored EEMEM value (midscale, 32, until a value is stored).</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.channel <span class="property-type">number</span></dt>
        <dd>Channel to act on: <code>0</code> or <code>1</code>.</dd>
        <dt>payload.code <span class="property-type">number</span></dt>
        <dd>With <code>channel</code>: wiper position 0–63 (clamped).</dd>
        <dt>payload.ohms <span class="property-type">number</span></dt>
        <dd>With <code>channel</code> (and no <code>code</code>): target W–B resistance in ohms, set to the nearest code.</dd>
        <dt>payload.store <span class="property-type">boolean</span></dt>
        <dd>If <code>true</code>: store both wipers in EEMEM (restored at power-on); replies <code>{ stored: true }</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any other message reads back both channels.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.channel, payload.code, payload.resistance <span class="property-type">number</span></dt>
        <dd>After a set: the channel, the wiper code read back, and the resulting W–B resistance in ohms.</dd>
        <dt>payload.wiper <span class="property-type">number[2]</span></dt>
        <dd>After any other message: wiper codes of channels 0 and 1.</dd>
        <dt>payload.resistance <span class="property-type">number[2]</span></dt>
        <dd>After any other message: W–B resistances (Ω) of channels 0 and 1.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the Linux I²C bus number, the part's end-to-end resistance RAB (50 kΩ), the I²C address (0x2C–0x2F) and the wiper resistance RW. Absolute resistance is only accurate to the part's tolerance (±20 %); ratios are exact.</p>
</script>
