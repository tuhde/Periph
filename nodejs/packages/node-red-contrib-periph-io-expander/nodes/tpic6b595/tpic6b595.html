<script type="text/html" data-help-name="periph-tpic6b595">
    <p>Drives a Texas Instruments TPIC6B595 8-bit power SIPO shift register (or
    multiple cascaded devices) through a SiPo (serial-in/parallel-out)
    connection. SER IN / SRCK may be either an SPI bus (hardware mode) or two
    plain GPIO lines (software / bit-bang mode); RCK is always a plain GPIO.
    Optional SRCLR and G lines add shift-register-clear and global output
    enable (PWM-style dimming).</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            <code>{ pin: N, value: 0|1 }</code> — set output pin N (global index across all cascaded devices).
            1 = ON (DMOS conducting, sinks current); 0 = OFF (high-impedance).<br>
            <code>{ port: N, value: 0x.. }</code> — write all 8 outputs of cascaded device N (0 = nearest the controller).<br>
            <code>{ command: "off" }</code> — turn every output off (<code>fill(false)</code>).<br>
            <code>{ outputEnable: true|false }</code> — global blank / un-blank via G (Full only).<br>
            <code>{ values: [d0, d1, ...] }</code> — write every cascaded device's byte in one call (Full only).
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The driver has no bus read-back; TPIC6B595 is write-only and
            every payload acts on the chip without producing a reply.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the RCK GPIO line (required) plus optional SRCLR / G / SER IN /
    SRCK pins. <code>numDevices</code> is the number of cascaded TPIC6B595s
    on the wire (default 1); the global pin index runs from 0 to
    <code>numDevices * 8 - 1</code>. Leave SER IN and SRCK blank to use the
    kernel <code>/dev/spidevB.D</code> device instead.</p>

    <h3>Notes</h3>
    <p>The TPIC6B595 only sinks current — its outputs can never source.
    Wire loads accordingly: an LED's anode goes to the supply (with a series
    resistor) and its cathode to a DRAIN pin (writing 1 turns the LED on).
    Cascaded writes always retransmit the entire chain reversed — the byte
    for device 0 (nearest the controller) is sent last.</p>
</script>
