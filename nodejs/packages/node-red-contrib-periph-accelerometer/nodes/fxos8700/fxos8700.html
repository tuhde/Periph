<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('fxos8700-device', {
        category: 'config',
        defaults: {
            name:        { value: '' },
            bus:         { value: '1', required: true, validate: RED.validators.number() },
            address:     { value: '0x1E', required: true },
            range:       { value: '2', required: true, validate: RED.validators.number() },
            dataRate:    { value: '200', required: true, validate: RED.validators.number() },
            declination: { value: '0', required: true, validate: RED.validators.number() }
        },
        label: function() {
            return this.name || ('FXOS8700 @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="fxos8700-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="FXOS8700">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address"><i class="fa fa-microchip"></i> I²C address</label>
        <select id="node-config-input-address" style="width:150px">
            <option value="0x1C">0x1C (SA1=1, SA0=0)</option>
            <option value="0x1D">0x1D (SA1=0, SA0=1)</option>
            <option value="0x1E" selected>0x1E (SA1=0, SA0=0)</option>
            <option value="0x1F">0x1F (SA1=1, SA0=1)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-range">Range</label>
        <select id="node-config-input-range" style="width:150px">
            <option value="2" selected>±2 g</option>
            <option value="4">±4 g</option>
            <option value="8">±8 g</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-dataRate">Data rate (Hz)</label>
        <select id="node-config-input-dataRate" style="width:220px">
            <option value="800">800 Hz (400 per sensor)</option>
            <option value="400">400 Hz (200 per sensor)</option>
            <option value="200" selected>200 Hz (100 per sensor)</option>
            <option value="100">100 Hz (50 per sensor)</option>
            <option value="50">50 Hz (25 per sensor)</option>
            <option value="12.5">12.5 Hz (6.25 per sensor)</option>
            <option value="6.25">6.25 Hz (3.125 per sensor)</option>
            <option value="1.5625">1.5625 Hz (0.78 per sensor)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-declination">Declination (°)</label>
        <input type="number" id="node-config-input-declination" step="0.1" style="width:100px">
    </div>
</script>

<!-- Read node: trigger → measurements -->
<script type="text/javascript">
    RED.nodes.registerType('periph-fxos8700', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'fxos8700-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-compass',
        label:   function() { return this.name || 'FXOS8700'; },
        paletteLabel: 'FXOS8700'
    });
</script>

<script type="text/html" data-template-name="periph-fxos8700">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="FXOS8700">
    </div>
</script>

<script type="text/html" data-help-name="periph-fxos8700">
    <p>Reads 3-axis acceleration, 3-axis magnetic flux density, the tilt-compensated compass heading
    and the die temperature from an NXP FXOS8700CQ 6-axis e-compass over I²C. The chip runs in
    hybrid mode, so both sensors are read with one 12-byte burst.</p>
    <p>Any input message triggers a measurement. The device is configured via a
    <b>fxos8700-device</b> config node.</p>

    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload.accel.x / y / z <span class="property-type">number</span></dt>
        <dd>Acceleration in <i>g</i>.</dd>
        <dt>payload.mag.x / y / z <span class="property-type">number</span></dt>
        <dd>Magnetic flux density in µT.</dd>
        <dt>payload.heading <span class="property-type">number</span></dt>
        <dd>Tilt-compensated heading in degrees, 0–360, including the configured declination
        (<code>null</code> if the read failed).</dd>
        <dt>payload.temperature <span class="property-type">number</span></dt>
        <dd>Die temperature in °C (relative, uncalibrated; <code>null</code> if unavailable).</dd>
    </dl>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>I²C bus</dt><dd>Linux bus number (<code>/dev/i2c-N</code>).</dd>
        <dt>I²C address</dt><dd><code>0x1C</code>–<code>0x1F</code>, selected by <code>SA1</code> / <code>SA0</code>. Do not leave <code>SA0</code> floating.</dd>
        <dt>Range</dt><dd>Accelerometer range ±2 / ±4 / ±8 <i>g</i>.</dd>
        <dt>Data rate</dt><dd>System output data rate; each sensor runs at half this rate in hybrid mode.</dd>
        <dt>Declination</dt><dd>Magnetic declination in degrees added to the heading.</dd>
    </dl>
</script>
