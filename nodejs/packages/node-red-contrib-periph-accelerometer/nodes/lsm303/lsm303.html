<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('lsm303-device', {
        category: 'config',
        defaults: {
            name:           { value: '' },
            bus:            { value: '1', required: true, validate: RED.validators.number() },
            accelRange:     { value: '2', required: true },
            accelDataRate:  { value: '100', required: true },
            magRange:       { value: '130', required: true },
            magDataRate:    { value: '15', required: true }
        },
        label: function() {
            return this.name || ('LSM303 (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="lsm303-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="LSM303">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-accelRange">Accelerometer range</label>
        <select id="node-config-input-accelRange" style="width:150px">
            <option value="2" selected>±2 g</option>
            <option value="4">±4 g</option>
            <option value="8">±8 g</option>
            <option value="16">±16 g</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-accelDataRate">Accelerometer data rate (Hz)</label>
        <select id="node-config-input-accelDataRate" style="width:180px">
            <option value="1">1 Hz</option>
            <option value="10">10 Hz</option>
            <option value="25">25 Hz</option>
            <option value="50">50 Hz</option>
            <option value="100" selected>100 Hz</option>
            <option value="200">200 Hz</option>
            <option value="400">400 Hz</option>
            <option value="1344">1.344 kHz (normal / high-resolution)</option>
            <option value="1620">1.620 kHz (low-power)</option>
            <option value="5376">5.376 kHz (low-power)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-magRange">Magnetometer range</label>
        <select id="node-config-input-magRange" style="width:150px">
            <option value="130" selected>±130 µT</option>
            <option value="190">±190 µT</option>
            <option value="250">±250 µT</option>
            <option value="400">±400 µT</option>
            <option value="470">±470 µT</option>
            <option value="560">±560 µT</option>
            <option value="810">±810 µT</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-magDataRate">Magnetometer data rate (Hz)</label>
        <select id="node-config-input-magDataRate" style="width:150px">
            <option value="0.75">0.75 Hz</option>
            <option value="1.5">1.5 Hz</option>
            <option value="3">3 Hz</option>
            <option value="7.5">7.5 Hz</option>
            <option value="15" selected>15 Hz</option>
            <option value="30">30 Hz</option>
            <option value="75">75 Hz</option>
            <option value="220">220 Hz</option>
        </select>
    </div>
</script>

<!-- Read node: trigger → measurements -->
<script type="text/javascript">
    RED.nodes.registerType('periph-lsm303', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'lsm303-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-compass',
        label:   function() { return this.name || 'LSM303'; },
        paletteLabel: 'LSM303'
    });
</script>

<script type="text/html" data-template-name="periph-lsm303">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="LSM303">
    </div>
</script>

<script type="text/html" data-help-name="periph-lsm303">
    <p>Reads 3-axis acceleration, 3-axis magnetic flux density, a tilt-compensated compass heading, and the relative on-chip temperature from an LSM303 e-compass over I²C.</p>
    <p>Any input message triggers a measurement. The device is configured via an <b>lsm303-device</b> config node.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers a measurement.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.acceleration <span class="property-type">object</span></dt>
        <dd><code>x</code>, <code>y</code>, <code>z</code> acceleration in <i>g</i>.</dd>
        <dt>payload.magnetic <span class="property-type">object</span></dt>
        <dd><code>x</code>, <code>y</code>, <code>z</code> magnetic flux density in µT.</dd>
        <dt>payload.heading <span class="property-type">number</span></dt>
        <dd>Tilt-compensated compass heading in degrees (0–360).</dd>
        <dt>payload.temperature_delta <span class="property-type">number</span></dt>
        <dd>Relative on-chip temperature in °C (8 LSB/°C, or <code>null</code> if the read failed).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the I²C bus number, the accelerometer range and data rate, and the magnetometer
    range and data rate. Both I²C addresses are fixed: <code>0x19</code> (accelerometer) and
    <code>0x1E</code> (magnetometer).</p>
</script>
