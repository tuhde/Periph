<script type="text/html" data-help-name="periph-lsm303">
    <p>Reads 3-axis acceleration, 3-axis magnetic field, tilt-compensated compass heading
    and relative temperature from an LSM303 (accelerometer + magnetometer) over I²C.</p>
    <p>The accelerometer is addressed at <code>0x19</code> and the magnetometer at
    <code>0x1E</code>; both addresses are fixed. Any input message triggers a measurement.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers a measurement.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.acceleration <span class="property-type">object</span></dt>
        <dd>Acceleration <code>{ x, y, z }</code> in <i>g</i>.</dd>
        <dt>payload.magnetic <span class="property-type">object</span></dt>
        <dd>Magnetic flux density <code>{ x, y, z }</code> in µT.</dd>
        <dt>payload.heading <span class="property-type">number</span></dt>
        <dd>Tilt-compensated compass heading in degrees, 0–360.</dd>
        <dt>payload.temperature_delta <span class="property-type">number</span></dt>
        <dd>Relative temperature in °C (not an absolute reference).</dd>
    </dl>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Bus <span class="property-type">number</span></dt>
        <dd>I²C bus number (Linux <code>/dev/i2c-N</code>).</dd>
        <dt>Accel range <span class="property-type">select</span></dt>
        <dd>Full scale: ±2, ±4, ±8 or ±16 <i>g</i>.</dd>
        <dt>Accel data rate <span class="property-type">select</span></dt>
        <dd>Output data rate in Hz (1 Hz to 5.376 kHz). 1.620 kHz and 5.376 kHz are low-power only.</dd>
        <dt>Mag range <span class="property-type">select</span></dt>
        <dd>Magnetometer full scale, ±130 to ±810 µT.</dd>
        <dt>Mag data rate <span class="property-type">select</span></dt>
        <dd>Magnetometer output data rate, 0.75 to 220 Hz.</dd>
    </dl>
    <p>Heading is computed in software in the sensor frame. The datasheet does not
    document the axis alignment between the accelerometer and magnetometer dies, nor a
    magnetic declination; verify on hardware before relying on the value.</p>
</script>
