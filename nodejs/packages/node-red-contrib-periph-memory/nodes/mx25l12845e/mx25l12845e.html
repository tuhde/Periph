<!-- Config node: one instance per physical chip -->
<script type="text/javascript">
    RED.nodes.registerType('mx25l12845e-device', {
        category: 'config',
        defaults: {
            name:   { value: '' },
            bus:    { value: '0', required: true, validate: RED.validators.number() },
            device: { value: '0', required: true, validate: RED.validators.number() },
            speed:  { value: '8000000', required: true, validate: RED.validators.number() }
        },
        label: function() {
            return this.name || ('MX25L12845E @ spidev' + this.bus + '.' + this.device);
        }
    });
</script>

<script type="text/html" data-template-name="mx25l12845e-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="MX25L12845E">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> SPI bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/spidevB.D)
    </div>
    <div class="form-row">
        <label for="node-config-input-device">Device</label>
        <input type="number" id="node-config-input-device" min="0" style="width:80px"> &nbsp;chip-select number D
    </div>
    <div class="form-row">
        <label for="node-config-input-speed">Clock (Hz)</label>
        <input type="number" id="node-config-input-speed" min="100000" max="50000000" style="width:120px"> &nbsp;default 8000000
    </div>
</script>

<!-- Operation node: trigger → id / status / info / read / write / erase -->
<script type="text/javascript">
    RED.nodes.registerType('mx25l12845e', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'mx25l12845e-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-hdd-o',
        label:   function() { return this.name || 'MX25L12845E'; },
        paletteLabel: 'MX25L12845E (NOR flash)'
    });
</script>

<script type="text/html" data-template-name="mx25l12845e">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="MX25L12845E">
    </div>
</script>

<script type="text/html" data-help-name="mx25l12845e">
    <p>Reads, writes and erases the 16 MiB Macronix MX25L12845E SPI NOR flash by byte address.
    Writes are erase-aware: the node erases a 4 KiB sector itself when bits must go from 0 to 1,
    and keeps the other bytes of that sector. There is no filesystem.</p>
    <p>Any input message triggers an operation. The chip is configured via an
    <b>mx25l12845e-device</b> config node. Flash wears out after about 100 000 erase cycles per sector.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>op <span class="property-type">string</span></dt>
        <dd>Operation: <code>read</code> (default), <code>write</code>, <code>erase</code> (the
        4 KiB sector containing <code>address</code>), <code>id</code>, <code>status</code> or
        <code>info</code>. May be passed in <code>msg.op</code>.</dd>
        <dt>address <span class="property-type">number</span></dt>
        <dd>Byte address 0–16777215 (default 0).</dd>
        <dt>length <span class="property-type">number</span></dt>
        <dd>Number of bytes to read (<code>read</code> only; default 16).</dd>
        <dt>payload <span class="property-type">Buffer</span></dt>
        <dd>Data to write (<code>write</code> only; alternatively <code>msg.data</code> as an array of numbers).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">Buffer | object</span></dt>
        <dd><code>read</code>: the bytes as a Buffer. <code>id</code>: JEDEC ID and serial-number area
        (hex). <code>status</code>: status register, block protection, security register, busy flag.
        <code>info</code>: block geometry. Other operations: <code>{ ok: true }</code>.</dd>
    </dl>
</script>
