<script type="text/javascript">
    RED.nodes.registerType('periph-as7262', {
        category:  'Peripheral',
        color: '#C084FC',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '0x49' },
            gain:    { value: '16' },
            integrationTime: { value: '165.2', validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.svg',
        label: function() {
            return this.name || ('AS7262 @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="periph-as7262">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="AS7262">
    </div>
    <div class="form-row">
        <label for="node-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-input-address"><i class="fa fa-microchip"></i> I²C address</label>
        <input type="text" id="node-input-address" style="width:80px" placeholder="0x49"> &nbsp;(fixed, 0x49)
    </div>
    <div class="form-row">
        <label for="node-input-gain"><i class="fa fa-sliders"></i> Gain</label>
        <select id="node-input-gain" style="width:100px">
            <option value="1">1×</option>
            <option value="3.7">3.7×</option>
            <option value="16">16×</option>
            <option value="64">64×</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-integrationTime"><i class="fa fa-clock-o"></i> Integration</label>
        <input type="text" id="node-input-integrationTime" style="width:80px"> &nbsp;ms per bank (2.8 – 714)
    </div>
</script>

<script type="text/html" data-help-name="periph-as7262">
    <p>Reads the six visible spectral channels (violet 450 nm, blue 500 nm, green 550 nm, yellow 570 nm,
    orange 600 nm, red 650 nm) and the chip temperature from an ams OSRAM AS7262 over I²C (fixed address 0x49)
    with one one-shot conversion per message.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers one one-shot conversion (two integration times, 330 ms at the default setting).</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.violet, blue, green, yellow, orange, red <span class="property-type">number</span></dt>
        <dd>Calibrated channel values (floats, as delivered by the chip).</dd>
        <dt>payload.temperature <span class="property-type">number</span></dt>
        <dd>Device temperature in °C.</dd>
    </dl>
    <h3>Configuration</h3>
    <p>I²C bus number, I²C address (0x49), gain (1×, 3.7×, 16×, 64×) and integration time per bank in milliseconds
    (2.8 to 714, rounded to a multiple of 2.8 ms). The chip is reset and configured when the node is deployed.</p>
</script>
