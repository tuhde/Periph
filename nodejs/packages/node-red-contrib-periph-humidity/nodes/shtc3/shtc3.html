<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('shtc3-device', {
        category: 'config',
        defaults: {
            name:               { value: '' },
            bus:                { value: '1', required: true, validate: RED.validators.number() },
            address:            { value: '0x70' },
            lowPower:           { value: false }
        },
        label: function() {
            return this.name || ('SHTC3 @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="shtc3-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="SHTC3">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address"><i class="fa fa-microchip"></i> I²C address</label>
        <input type="text" id="node-config-input-address" style="width:80px" placeholder="0x70"> &nbsp;(fixed 0x70)
    </div>
    <div class="form-row">
        <label for="node-config-input-lowPower"><i class="fa fa-cog"></i> Low-power mode</label>
        <input type="checkbox" id="node-config-input-lowPower" style="width:auto"> &nbsp;0.7 ms measurement instead of 10.8 ms (slightly noisier)
    </div>
</script>

<!-- Read node -->
<script type="text/javascript">
    RED.nodes.registerType('shtc3', {
        category:  'Peripheral',
        color: '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'shtc3-device', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.svg',
        label:   function() { return this.name || 'SHTC3'; },
        paletteLabel: 'SHTC3'
    });
</script>

<script type="text/html" data-template-name="shtc3">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="SHTC3">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
</script>

<script type="text/html" data-help-name="shtc3">
    <p>Reads temperature and relative humidity from a Sensirion SHTC3 over I²C (address 0x70). Each message wakes the
    sensor, runs one CRC-checked measurement and puts it back to sleep.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers one measurement.</dd>
        <dt>low_power <span class="property-type">boolean</span></dt>
        <dd>Optional. Overrides the configured measurement mode for this reading.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.temperature_c <span class="property-type">number</span></dt>
        <dd>Temperature in °C.</dd>
        <dt>payload.humidity_pct <span class="property-type">number</span></dt>
        <dd>Relative humidity in %RH (0 to 100).</dd>
    </dl>
    <h3>Configuration</h3>
    <p>I²C bus number, I²C address (0x70) and the low-power mode, set in the <b>shtc3-device</b> config node.</p>
</script>
