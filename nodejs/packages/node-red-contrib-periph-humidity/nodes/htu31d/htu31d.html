<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('htu31d-device', {
        category: 'config',
        defaults: {
            name:               { value: '' },
            bus:                { value: '1', required: true, validate: RED.validators.number() },
            address:            { value: '0x40' },
            osrRh:              { value: '3' },
            osrT:               { value: '3' },
            heater:             { value: false }
        },
        label: function() {
            return this.name || ('HTU31D @ ' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="htu31d-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="HTU31D">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address"><i class="fa fa-microchip"></i> I²C address</label>
        <input type="text" id="node-config-input-address" style="width:80px" placeholder="0x40"> &nbsp;(0x40 or 0x41, IC_Add pin)
    </div>
    <div class="form-row">
        <label for="node-config-input-osrRh"><i class="fa fa-cog"></i> Humidity oversampling</label>
        <select id="node-config-input-osrRh" style="width:120px">
            <option value="0">OSR 0</option>
            <option value="1">OSR 1</option>
            <option value="2">OSR 2</option>
            <option value="3" selected>OSR 3</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-osrT"><i class="fa fa-cog"></i> Temperature oversampling</label>
        <select id="node-config-input-osrT" style="width:120px">
            <option value="0">OSR 0</option>
            <option value="1">OSR 1</option>
            <option value="2">OSR 2</option>
            <option value="3" selected>OSR 3</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-heater"><i class="fa fa-fire"></i> Heater</label>
        <input type="checkbox" id="node-config-input-heater" style="width:auto"> &nbsp;on (do not measure while heating)
    </div>
</script>

<!-- Read node -->
<script type="text/javascript">
    RED.nodes.registerType('htu31d', {
        category:  'Peripheral',
        color: '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'htu31d-device', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.svg',
        label:   function() { return this.name || 'HTU31D'; },
        paletteLabel: 'HTU31D'
    });
</script>

<script type="text/html" data-template-name="htu31d">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="HTU31D">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
</script>

<script type="text/html" data-help-name="htu31d">
    <p>Reads temperature and relative humidity from a TE Connectivity HTU31D over I²C (address 0x40 or 0x41)
    with one CRC-checked conversion per message.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers one measurement.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.temperature_c <span class="property-type">number</span></dt>
        <dd>Temperature in °C.</dd>
        <dt>payload.humidity_pct <span class="property-type">number</span></dt>
        <dd>Relative humidity in %RH (0 to 100).</dd>
    </dl>
    <h3>Configuration</h3>
    <p>I²C bus number, I²C address (0x40 or 0x41), the humidity and temperature oversampling (OSR 0 to 3) and the
    internal heater, set in the <b>htu31d-device</b> config node.</p>
</script>
