<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('mpr121-device', {
        category: 'config',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '5A', required: true }
        },
        label: function() {
            return this.name || ('MPR121 @ 0x' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="mpr121-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="MPR121">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address">Address (hex)</label>
        <input type="text" id="node-config-input-address" placeholder="5A" style="width:80px"> &nbsp;default: 5A (0x5A)
    </div>
</script>

<!-- Read node: trigger -> touch bitmask -->
<script type="text/javascript">
    RED.nodes.registerType('mpr121', {
        category:  'Periph',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'mpr121-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-hand-pointer-o',
        label:   function() { return this.name || 'MPR121'; },
        paletteLabel: 'MPR121'
    });
</script>

<script type="text/html" data-template-name="mpr121">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="MPR121">
    </div>
</script>

<script type="text/html" data-help-name="mpr121">
    <p>Reads the 12-electrode touch bitmask from an MPR121 capacitive touch sensor over I²C.</p>
    <p>Any input message triggers a measurement. The device is configured via an <b>mpr121-device</b> config node.</p>

    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload.touched <span class="property-type">number</span></dt>
        <dd>12-bit bitmask; bit n = 1 if ELEn is currently touched (ELE0 at LSB).</dd>
        <dt>payload.electrodes <span class="property-type">boolean[12]</span></dt>
        <dd>12-element array of booleans, one per electrode (ELE0..ELE11).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the I²C bus number and the chip's 7-bit address (default <code>0x5A</code>) in the device config node.
    The driver uses default touch/release thresholds (12 / 6) and runs autoconfiguration on the chip's first measurement.</p>
</script>
