<script type="text/javascript">
    RED.nodes.registerType('periph-tmp117', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:          { value: '' },
            bus:           { value: '1', required: true, validate: RED.validators.number() },
            address:       { value: '0x48' },
            averaging:     { value: '8' },
            cycleSeconds:  { value: '1' },

            alertEnabled:  { value: false },
            highLimit:     { value: '30', validate: RED.validators.number() },
            lowLimit:      { value: '10', validate: RED.validators.number() },
            alertMode:     { value: 'alert' },
            polarity:      { value: 'active_low' }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-thermometer-half',
        label:   function() { return this.name || 'TMP117'; },
        paletteLabel: 'TMP117'
    });
</script>

<script type="text/html" data-template-name="periph-tmp117">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="TMP117">
    </div>
    <div class="form-row">
        <label for="node-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-input-address"><i class="fa fa-map-marker"></i> I²C address</label>
        <select id="node-input-address" style="width:200px">
            <option value="0x48">0x48 (ADD0 = GND)</option>
            <option value="0x49">0x49 (ADD0 = V+)</option>
            <option value="0x4A">0x4A (ADD0 = SDA)</option>
            <option value="0x4B">0x4B (ADD0 = SCL)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-averaging"><i class="fa fa-sliders"></i> Averaging</label>
        <select id="node-input-averaging" style="width:200px">
            <option value="0">none</option>
            <option value="8">8 conversions</option>
            <option value="32">32 conversions</option>
            <option value="64">64 conversions</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-cycleSeconds"><i class="fa fa-clock-o"></i> Cycle time</label>
        <select id="node-input-cycleSeconds" style="width:200px">
            <option value="0.0155">15.5 ms</option>
            <option value="0.125">125 ms</option>
            <option value="0.25">250 ms</option>
            <option value="0.5">500 ms</option>
            <option value="1">1 s</option>
            <option value="4">4 s</option>
            <option value="8">8 s</option>
            <option value="16">16 s</option>
        </select>
    </div>

    <hr>
    <div class="form-row">
        <label for="node-input-alertEnabled"><i class="fa fa-bell"></i> Alert</label>
        <input type="checkbox" id="node-input-alertEnabled" style="width:auto"> enabled (emits a <code>source</code> message when a limit trips)
    </div>
    <div class="form-row">
        <label for="node-input-highLimit">&nbsp; THIGH °C</label>
        <input type="text" id="node-input-highLimit" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-lowLimit">&nbsp; TLOW °C</label>
        <input type="text" id="node-input-lowLimit" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-alertMode">&nbsp; Mode</label>
        <select id="node-input-alertMode" style="width:200px">
            <option value="alert">Alert (window)</option>
            <option value="therm">Therm (latching, TLOW resets)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-polarity">&nbsp; Polarity</label>
        <select id="node-input-polarity" style="width:200px">
            <option value="active_low">Active low</option>
            <option value="active_high">Active high</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="periph-tmp117">
    <p>Reads the temperature from a TMP117 ±0.1 °C high-accuracy digital temperature sensor over I²C, and optionally reports its THIGH/TLOW limit alerts.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Any incoming message triggers a temperature and alert-flag read.</dd>
        <dt>payload.mode <span class="property-type">string</span> (optional)</dt>
        <dd><code>"continuous"</code>, <code>"shutdown"</code> or <code>"one_shot"</code> changes the conversion mode, keeping the configured averaging and cycle time. No output is sent.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.temperature_c <span class="property-type">number</span></dt>
        <dd>Temperature in °C (-256 until the first conversion after power-up).</dd>
        <dt>payload.high_alert <span class="property-type">boolean</span></dt>
        <dd>HIGH_Alert flag: the result exceeded THIGH.</dd>
        <dt>payload.low_alert <span class="property-type">boolean</span></dt>
        <dd>LOW_Alert flag: the result fell below TLOW (Alert mode only). In Alert mode reading the flags clears them.</dd>
        <dt>payload.source <span class="property-type">string</span></dt>
        <dd>Emitted separately, independent of the polling trigger above, when the Alert is enabled and a limit trips: <code>"high"</code> (above THIGH) or <code>"low"</code> (below TLOW).</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the I²C bus number, the address selected by the board's ADD0 strap (<code>0x48</code>–<code>0x4B</code>), and the averaging and cycle time — more averaging lowers noise, and the hardware lengthens short cycles automatically at higher averaging. Optionally enable the Alert: set the THIGH/TLOW limits (0.0078125 °C steps), choose Alert mode (a flag for each side of the window) or Therm mode (latches above THIGH until the temperature drops below TLOW), and the ALERT pin polarity.</p>
</script>
