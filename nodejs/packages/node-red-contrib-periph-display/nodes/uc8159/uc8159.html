<script type="text/javascript">
    RED.nodes.registerType('periph-uc8159', {
        category: 'Peripheral',
        color:    '#C084FC',
        defaults: {
            name:        { value: '' },
            spiBus:      { value: '0', required: true, validate: RED.validators.number() },
            spiDevice:   { value: '0', required: true, validate: RED.validators.number() },
            gpioChip:    { value: '0', required: true, validate: RED.validators.number() },
            dcPin:       { value: '25', required: true, validate: RED.validators.number() },
            resPin:      { value: '17', required: true, validate: RED.validators.number() },
            busyPin:     { value: '24', required: true, validate: RED.validators.number() },
            wireMode:    { value: 'simplex' },
            busyTimeout: { value: '60000', required: true, validate: RED.validators.number() },
            autoShow:    { value: false }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-television',
        label:   function() { return this.name || 'UC8159'; },
        paletteLabel: 'UC8159'
    });
</script>

<script type="text/html" data-template-name="periph-uc8159">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="UC8159">
    </div>
    <div class="form-row">
        <label for="node-input-spiBus"><i class="fa fa-microchip"></i> SPI bus</label>
        <input type="number" id="node-input-spiBus" min="0" style="width:70px">
        &nbsp;chip select <input type="number" id="node-input-spiDevice" min="0" style="width:70px">
    </div>
    <div class="form-row">
        <label for="node-input-gpioChip">GPIO chip</label>
        <input type="number" id="node-input-gpioChip" min="0" style="width:70px">
    </div>
    <div class="form-row">
        <label for="node-input-dcPin">D/C# line</label>
        <input type="number" id="node-input-dcPin" min="0" style="width:70px">
    </div>
    <div class="form-row">
        <label for="node-input-resPin">RES# line</label>
        <input type="number" id="node-input-resPin" min="0" style="width:70px">
    </div>
    <div class="form-row">
        <label for="node-input-busyPin">BUSY line</label>
        <input type="number" id="node-input-busyPin" min="0" style="width:70px">
    </div>
    <div class="form-row">
        <label for="node-input-wireMode">Wire mode</label>
        <select id="node-input-wireMode" style="width:260px">
            <option value="simplex">Simplex (MOSI to DIN, write only)</option>
            <option value="pin">Half-duplex pin (MOSI-resistor-MISO)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-busyTimeout">BUSY timeout (ms)</label>
        <input type="number" id="node-input-busyTimeout" min="0" style="width:100px">
    </div>
    <div class="form-row">
        <label for="node-input-autoShow">Auto-show</label>
        <input type="checkbox" id="node-input-autoShow" style="width:auto"> refresh after every drawing message
    </div>
</script>

<script type="text/html" data-help-name="periph-uc8159">
    <p>Draws on a UC8159 seven-colour e-paper panel (600 x 448, e.g. Waveshare 5.65inch e-Paper (F)) over SPI. Drawing messages change the framebuffer only; <code>show</code> sends it and refreshes the panel, which blocks the node for about 30 seconds.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.clear <span class="property-type">string</span></dt>
        <dd><code>"white"</code>, <code>"black"</code>, <code>"green"</code>, <code>"blue"</code>, <code>"red"</code>, <code>"yellow"</code> or <code>"orange"</code>: fill the framebuffer.</dd>
        <dt>payload.pixel <span class="property-type">object</span></dt>
        <dd><code>{ x, y, color }</code>: set one pixel.</dd>
        <dt>payload.line / payload.rect <span class="property-type">object</span></dt>
        <dd><code>{ x0, y0, x1, y1, color }</code> / <code>{ x, y, w, h, color, fill }</code>: draw primitives.</dd>
        <dt>payload.bitmap <span class="property-type">object</span></dt>
        <dd><code>{ x, y, w, h, data: [..], color }</code>: copy a 1-bit row-major MSB-first bitmap; set bits are drawn in <code>color</code>.</dd>
        <dt>payload.show <span class="property-type">boolean</span></dt>
        <dd><code>true</code> sends the frame, runs PON/DRF/POF and waits for BUSY.</dd>
        <dt>payload.sleep / payload.wake <span class="property-type">boolean</span></dt>
        <dd>Deep sleep, or hardware-reset wake (the framebuffer is kept).</dd>
        <dt>payload.read <span class="property-type">string</span></dt>
        <dd><code>"temperature"</code> or <code>"status"</code>. Needs the half-duplex pin wire mode.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload.updated <span class="property-type">boolean</span></dt>
        <dd><code>true</code> when a refresh has finished.</dd>
        <dt>payload.temperature / status / revision</dt>
        <dd>The result of a <code>read</code> request.</dd>
    </dl>
</script>
