<!-- Config node: one instance per physical device -->
<script type="text/javascript">
    RED.nodes.registerType('pcf8578-device', {
        category: 'config',
        defaults: {
            name:    { value: '' },
            bus:     { value: '1', required: true, validate: RED.validators.number() },
            address: { value: '3C', required: true },
            rows:    { value: '16', required: true, validate: RED.validators.number() }
        },
        label: function() {
            return this.name || ('PCF8578 @ 0x' + this.address + ' (bus ' + this.bus + ')');
        }
    });
</script>

<script type="text/html" data-template-name="pcf8578-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="PCF8578">
    </div>
    <div class="form-row">
        <label for="node-config-input-bus"><i class="fa fa-microchip"></i> I²C bus</label>
        <input type="number" id="node-config-input-bus" min="0" style="width:80px"> &nbsp;(Linux /dev/i2c-N)
    </div>
    <div class="form-row">
        <label for="node-config-input-address">I²C address (hex)</label>
        <select id="node-config-input-address" style="width:100px">
            <option value="3C">0x3C (SA0 = VSS)</option>
            <option value="3D">0x3D (SA0 = VDD)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-rows">Rows</label>
        <select id="node-config-input-rows" style="width:180px">
            <option value="8">8 rows x 32 columns (1:8)</option>
            <option value="16" selected>16 rows x 24 columns (1:16)</option>
            <option value="24">24 rows x 16 columns (1:24)</option>
            <option value="32">32 rows x 8 columns (1:32)</option>
        </select>
    </div>
</script>

<!-- Input node: message → draw on the display -->
<script type="text/javascript">
    RED.nodes.registerType('periph-pcf8578', {
        category:  'Peripheral',
        color:     '#C084FC',
        defaults: {
            name:   { value: '' },
            device: { value: '', type: 'pcf8578-device', required: true }
        },
        inputs:  1,
        outputs: 1,
        icon:    'font-awesome/fa-th',
        label:   function() { return this.name || 'PCF8578'; },
        paletteLabel: 'PCF8578'
    });
</script>

<script type="text/html" data-template-name="periph-pcf8578">
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="PCF8578">
    </div>
</script>

<script type="text/html" data-help-name="periph-pcf8578">
    <p>Draws on a PCF8578 row/column LCD dot-matrix driver over I²C (stand-alone mixed mode). Any incoming message triggers the writes described below. The device is configured via a <b>pcf8578-device</b> config node.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload.clear <span class="property-type">boolean</span></dt>
        <dd>When true, clears the display RAM.</dd>
        <dt>payload.pixel <span class="property-type">object</span></dt>
        <dd><code>{ x, y, on }</code> sets (<code>on</code> true or omitted) or clears one pixel at display column <code>x</code>, row <code>y</code>.</dd>
        <dt>payload.columns <span class="property-type">object</span></dt>
        <dd><code>{ x, bank, data: [b0, b1, …] }</code> writes column bytes in character mode at display column <code>x</code> of display bank <code>bank</code> (bit 0 = top row of the bank).</dd>
        <dt>payload.display <span class="property-type">string</span></dt>
        <dd><code>"blank"</code>, <code>"normal"</code>, <code>"all_on"</code> or <code>"inverse"</code>; the RAM is preserved.</dd>
        <dt>payload.scroll <span class="property-type">number</span></dt>
        <dd>Adds N (may be negative) to the start bank for hardware vertical scrolling in 8-row steps.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Pass-through of the original incoming message after the writes succeed.</dd>
    </dl>

    <h3>Configuration</h3>
    <p>Set the I²C bus number, the 7-bit address (0x3C for SA0=VSS or 0x3D for SA0=VDD) and the number of rows (8, 16, 24 or 32; columns = 40 − rows) in the device config node. The chip supports 100 kHz at most.</p>
</script>
