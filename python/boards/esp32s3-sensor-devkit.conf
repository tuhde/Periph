# Example board profile — illustrates the format, not a claim about a real
# product. Committed to the repo (unlike testconfig) because it describes a
# fact about known hardware, not a private bench — see
# specs/testing_framework.md, "Test Scenarios: Fixed Board vs Free-Wire
# Bench". Copy this file to define your own board.
#
# Selected with --board esp32s3-sensor-devkit. With no chip argument, every
# chip in BOARD_CHIPS is self-tested in turn. Shared by test_mp.sh and
# test_cp.sh - each reads only the MP_*/CP_* keys it needs, ignoring the
# rest, so one profile covers either firmware on this physical board.

# MicroPython (test_mp.sh)
MP_I2C_ID=0
MP_SDA=8
MP_SCL=9

# CircuitPython (test_cp.sh)
CP_SDA=board.IO8
CP_SCL=board.IO9

# Every chip permanently wired to this board.
BOARD_CHIPS=(gas/ens160 environmental/aht21)

# Per-chip address/sigrok mapping for this specific board. Both chips share
# one I2C bus here (GPIO8/9), differentiated only by address - a board with
# chips on separate buses would set different MP_SDA/MP_SCL per case.
case "${CATEGORY:-}/${CHIP:-}" in
    gas/ens160)
        I2C_ADDR=0x53
        SIGROK_CHANNELS="D0=SCL,D1=SDA"
        ;;
    environmental/aht21)
        I2C_ADDR=0x38
        SIGROK_CHANNELS="D0=SCL,D1=SDA"
        ;;
esac
