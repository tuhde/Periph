# Example board profile — illustrates the format, not a claim about a real
# product. Committed to the repo (unlike testconfig/testconfig_wiring)
# because it describes a fact about known hardware, not a private bench —
# see specs/testing_framework.md, "Test Scenarios: Fixed Board vs Free-Wire
# Bench". Copy this file to define your own board.
#
# Selected with --board esp32s3-sensor-devkit. With no chip argument, every
# chip in BOARD_CHIPS is self-tested in turn.

# Platform identifiers - each cpp platform script reads only the ones it
# needs, ignoring the rest, so one profile covers every firmware you might
# flash onto this physical board.
FQBN=esp32:esp32:esp32s3:CDCOnBoot=cdc
ZEPHYR_BOARD=esp32s3_devkitc/esp32s3/procpu
PORT=/dev/ttyACM0
ZEPHYR_PORT=/dev/ttyACM0

# Every chip permanently wired to this board.
BOARD_CHIPS=(gas/ens160 environmental/aht21)

# Per-chip pins/address/sigrok mapping for this specific board. Both chips
# share one I2C bus here (GPIO8/9), differentiated only by address - a board
# with chips on separate buses would set different I2C_SDA/I2C_SCL per case.
case "${CATEGORY:-}/${CHIP:-}" in
    gas/ens160)
        I2C_SDA=8
        I2C_SCL=9
        I2C_ADDR=0x53
        SIGROK_CHANNELS="D0=SCL,D1=SDA"
        ;;
    environmental/aht21)
        I2C_SDA=8
        I2C_SCL=9
        I2C_ADDR=0x38
        SIGROK_CHANNELS="D0=SCL,D1=SDA"
        ;;
esac
