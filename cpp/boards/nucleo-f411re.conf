    "accelerometer/ADXL345"
    "accelerometer/ADXL362"
    "adc_dac/AD7705"
    "adc_dac/HX711"
    "adc_dac/MCP4725"
    "environmental/AHT21"
    "environmental/BME280"
    "gnss/NEO6"
    "humidity/DHT11"
    "io_expander/PCF8574"
    "io_expander/TPIC6B595"
    "led/APA102"
    "led/WS2812B"
    "magnetometer/AS5600"
    "power/INA219"
    "power/INA226"
    "pressure/BMP280"
    "rtc/DS3231"
    "temperature/MCP9808"
    "temperature/TMP117"
)
