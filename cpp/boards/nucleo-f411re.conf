# Shared board profile for the STM32Cube platform's NUCLEO-F411RE reference
# board. Selected via `cpp/test_stm32cube.sh --board nucleo-f411re`.
#
# BOARD_CHIPS lists every chip this board is wired to test, in
# "<category>/<Chip>" form — grows as more chips get STM32Cube coverage
# (specs/feature_stm32cube_platform.md §9 Phase 3).
