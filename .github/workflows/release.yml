name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------------------------------
  # Extract version number from the tag (v1.2.3 → 1.2.3)
  # -----------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # Python — build wheel + sdist, attach to GitHub release
  # -----------------------------------------------------------------------
  python-build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' \
            python/pyproject.toml

      - name: Generate package README
        run: node python/scripts/generate-readme.js

      - name: Build
        run: |
          pip install --quiet build
          python -m build python/

      # Uploaded before the rename below so this artifact keeps the
      # PyPI-conventional filenames (periph-X.Y.Z.tar.gz / .whl) that
      # python-publish hands to PyPI unchanged.
      - uses: actions/upload-artifact@v4
        with:
          name: python-pypi-dist
          path: python/dist/

      - name: Rename sdist for the GitHub release asset listing
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mv python/dist/periph-${VERSION}.tar.gz \
             python/dist/periph-python-${VERSION}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  # -----------------------------------------------------------------------
  # Python — publish wheel + sdist to PyPI via trusted publishing (OIDC,
  # no stored token). Requires a one-time "pending publisher" registered
  # at https://pypi.org/manage/account/publishing/ for this repo, workflow
  # filename, and the "pypi" environment below.
  # -----------------------------------------------------------------------
  python-publish:
    needs: python-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-pypi-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # -----------------------------------------------------------------------
  # Arduino — zip cpp/ per Library Manager spec, attach to GitHub release
  # -----------------------------------------------------------------------
  arduino-build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Package
        run: |
          mkdir -p arduino-pkg/Periph
          cpp/scripts/stage-arduino-library.sh arduino-pkg/Periph "${{ needs.meta.outputs.version }}"
          cd arduino-pkg
          zip -r ../Periph-cpp-${{ needs.meta.outputs.version }}.zip Periph/

      - uses: actions/upload-artifact@v4
        with:
          name: arduino-dist
          path: Periph-cpp-*.zip

  # -----------------------------------------------------------------------
  # Node.js — publish all workspace packages to npm
  # periph core is published first; contrib packages follow
  # -----------------------------------------------------------------------
  nodejs-publish:
    needs: meta
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >=11.5.1; don't rely on
      # whatever version happens to ship with the Node.js release above.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Stamp version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          for f in nodejs/packages/*/package.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Generate periph / Node-RED package READMEs
        run: node nodejs/scripts/generate-readmes.js

      - name: Publish periph core
        working-directory: nodejs
        run: npm publish --workspace periph --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Node-RED contrib packages
        working-directory: nodejs
        run: |
          for d in packages/node-red-contrib-periph-*/; do
            name=$(jq -r '.name' "$d/package.json")
            npm publish --workspace "$name" --access public || \
              echo "WARNING: $name publish failed or is already at this version"
            sleep 10
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -----------------------------------------------------------------------
  # Rust — publish periph crate to crates.io
  # -----------------------------------------------------------------------
  rust-publish:
    needs: meta
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-release-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Stamp version
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' \
            rust/periph/Cargo.toml

      - name: Generate crate README
        run: node rust/scripts/generate-readme.js

      # Exchanges this job's OIDC identity for a short-lived crates.io
      # token via trusted publishing -- no CARGO_REGISTRY_TOKEN secret
      # needed once the crate's trusted publisher is configured.
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --manifest-path rust/periph/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # -----------------------------------------------------------------------
  # JVM — build JARs, attach to GitHub release
  # -----------------------------------------------------------------------
  jvm-build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Stamp version
        run: |
          mvn versions:set -DnewVersion=${{ needs.meta.outputs.version }} \
            -DgenerateBackupPoms=false \
            --batch-mode --no-transfer-progress
        working-directory: jvm

      - name: Build
        run: mvn package --batch-mode --no-transfer-progress -DskipTests
        working-directory: jvm

      - name: Collect JARs
        run: |
          mkdir jvm-jars
          find jvm -name '*.jar' -path '*/target/*' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            | xargs cp -t jvm-jars/

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-dist
          path: jvm-jars/

  # -----------------------------------------------------------------------
  # Arduino — publish the Library Manager layout to tuhde/Periph-Arduino
  # The Library Manager needs library.properties at a repository root and
  # indexes every tag, so the library lives in its own repo: one commit and
  # one plain vX.Y.Z tag per release. Pushed with a deploy key that has write
  # access to that repo only (secret ARDUINO_REPO_DEPLOY_KEY).
  # -----------------------------------------------------------------------
  arduino-publish:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: tuhde/Periph-Arduino
          ssh-key: ${{ secrets.ARDUINO_REPO_DEPLOY_KEY }}
          path: periph-arduino
          fetch-depth: 0

      - name: Stage library
        run: cpp/scripts/stage-arduino-library.sh periph-arduino "${{ needs.meta.outputs.version }}"

      - name: Commit, tag and push
        run: |
          TAG="v${{ needs.meta.outputs.version }}"
          cd periph-arduino
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Release ${TAG}" -m "Generated from tuhde/Periph@${GITHUB_SHA}."
          fi
          # Idempotent under a retry: if a prior run already published this
          # release (another job failed afterwards), the tag exists on the
          # same commit and is left alone. A tag on a different commit means
          # the version was already released with other content -- fail
          # rather than move it, the Library Manager rejects reused versions.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "error: ${TAG} already exists in Periph-Arduino on a different commit" >&2
              exit 1
            fi
          else
            git tag "$TAG"
          fi
          git push origin HEAD:main
          git push origin "$TAG"

  # -----------------------------------------------------------------------
  # INSTALL.md — stamp version and commit back to main
  # -----------------------------------------------------------------------
  update-install-md:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Stamp version
        run: |
          OLD=$(grep -oP '(?<=<!-- periph-version: )[^ >]+(?= -->)' INSTALL.md)
          NEW="${{ needs.meta.outputs.version }}"
          sed -i "s/${OLD//./\\.}/${NEW}/g" INSTALL.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add INSTALL.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update INSTALL.md to v${{ needs.meta.outputs.version }} [skip ci]"
            git push origin main
          fi

  # -----------------------------------------------------------------------
  # Release — create GitHub release and attach all file artifacts
  # nodejs-publish and rust-publish are listed as dependencies so the
  # release is only created when all platforms have succeeded
  # -----------------------------------------------------------------------
  release:
    needs: [meta, python-build, python-publish, arduino-build, arduino-publish, nodejs-publish, rust-publish, jvm-build, update-install-md]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          name: "Periph v${{ needs.meta.outputs.version }}"
          files: artifacts/**
          generate_release_notes: true
