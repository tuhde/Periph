name: CI

# Runs on the self-hosted runner (labels: self-hosted, linux, periph), bare
# host with the toolchains from TOOLCHAINS.md preinstalled. Every job is one
# call to scripts/ci/run.sh, which .gitlab-ci.yml uses too; edit job logic
# there, not here. Runner setup: CONTRIBUTING.md ("Self-hosted CI runner").
#
# Scope: pull requests and pushes to main run a reduced CI -- run.sh skips jobs
# the diff cannot affect and builds only the touched C++ chips plus a smoke set
# (scripts/ci/changed.sh). The full matrix runs only for workflow_dispatch;
# release.yml refuses to publish a tag unless such a run passed on that commit.
# ESP-IDF (5 shards) and Zephyr (4) are sharded on every run; Arduino AVR is 1.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # always the full matrix (the release gate)

# A new push to a PR supersedes its running CI; main pushes always finish.
# The event is part of the group so a queued full run is not replaced by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PERIPH_CI_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'auto' }}
  PERIPH_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  arduino-avr:
    name: Arduino compile AVR
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh arduino-avr --shard ${{ matrix.shard }}/1

  arduino-checks:
    name: Arduino checks
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh arduino-checks

  linux-gcc:
    name: Linux GCC compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh linux-gcc

  pico-sdk:
    name: Pico SDK compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh pico-sdk

  stm32cube:
    name: STM32Cube compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh stm32cube

  python:
    name: Python syntax
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh python

  registry:
    name: I2C discovery registry
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh registry

  nodejs:
    name: Node.js
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh nodejs

  java:
    name: Java compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh java

  esp-idf:
    name: ESP-IDF compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh esp-idf --shard ${{ matrix.shard }}/5

  zephyr:
    name: Zephyr compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh zephyr --shard ${{ matrix.shard }}/4

  rust:
    name: Rust compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh rust

  go-linux:
    name: Go compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh go-linux

  go-tinygo:
    name: TinyGo compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh go-tinygo
