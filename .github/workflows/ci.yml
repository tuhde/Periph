name: CI

# Runs on the self-hosted runner (labels: self-hosted, linux, periph), bare
# host with the toolchains from TOOLCHAINS.md preinstalled. Every job is one
# call to scripts/ci/run.sh, which .gitlab-ci.yml uses too; edit job logic
# there, not here. Runner setup: CONTRIBUTING.md ("Self-hosted CI runner").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its running CI; main pushes always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  arduino-esp32:
    name: Arduino compile ESP32-S3
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh arduino-esp32

  arduino-avr:
    name: Arduino compile AVR
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh arduino-avr

  arduino-checks:
    name: Arduino checks
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh arduino-checks

  linux-gcc:
    name: Linux GCC compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh linux-gcc

  pico-sdk:
    name: Pico SDK compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh pico-sdk

  stm32cube:
    name: STM32Cube compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh stm32cube

  python:
    name: Python syntax
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh python

  registry:
    name: I2C discovery registry
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh registry

  nodejs:
    name: Node.js
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh nodejs

  java:
    name: Java compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh java

  esp-idf:
    name: ESP-IDF compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh esp-idf

  zephyr:
    name: Zephyr compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh zephyr

  rust:
    name: Rust compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh rust

  go-linux:
    name: Go compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh go-linux

  go-tinygo:
    name: TinyGo compile
    runs-on: [self-hosted, linux, periph]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - run: scripts/ci/run.sh go-tinygo
