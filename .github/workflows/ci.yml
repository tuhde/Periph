name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------------------------------
  # Arduino — compile-only (no hardware required)
  # -----------------------------------------------------------------------
  arduino:
    name: Arduino compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Arduino board packages
        uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: arduino15-esp32-

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile test sketches
        run: cpp/test_arduino.sh --compile-only power/ina226

      - name: Check cpp/README.md is up to date
        run: node cpp/scripts/generate-readme.js --check

  # -----------------------------------------------------------------------
  # Linux GCC — compile-only (no hardware required)
  # -----------------------------------------------------------------------
  linux-gcc:
    name: Linux GCC compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile test programs
        run: cpp/test_linux.sh --compile-only power/ina226

  # -----------------------------------------------------------------------
  # Raspberry Pi Pico SDK — compile-only (no hardware required).
  # Builds one example per transport to catch the regressions the
  # full retrofill would otherwise let through CI. The full chip
  # coverage matrix lives in `cpp/test_picosdk.sh --compile-only`,
  # which we run against every chip's test app below.
  # -----------------------------------------------------------------------
  pico-sdk:
    name: Pico SDK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pico-sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi gcc g++ python3
          git clone --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          (cd /opt/pico-sdk && git submodule update --init --depth 1)
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Build I2C example
        run: cpp/test_picosdk.sh --compile-only power/ina226
        env:
          PICO_BOARD: pico

      - name: Build SPI example
        run: cpp/test_picosdk.sh --compile-only pressure/bmp280
        env:
          PICO_BOARD: pico

      - name: Build UART example
        run: cpp/test_picosdk.sh --compile-only comms/rda5807m
        env:
          PICO_BOARD: pico

      - name: Build NeoPixel example
        run: cpp/test_picosdk.sh --compile-only led/ws2812b
        env:
          PICO_BOARD: pico

      - name: Build HX711 example
        run: cpp/test_picosdk.sh --compile-only adc_dac/hx711
        env:
          PICO_BOARD: pico

  # -----------------------------------------------------------------------
  # Python — syntax check across all chip drivers and tests
  # -----------------------------------------------------------------------
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check syntax
        run: |
          find python/periph python/tests python/examples -name '*.py' \
            | xargs python3 -m py_compile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check UIFlow 1 .m5b files are up to date
        run: python/uiflow1/generate.sh --check

  # -----------------------------------------------------------------------
  # Node.js — install deps, check syntax, verify chip driver loads
  # -----------------------------------------------------------------------
  nodejs:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nodejs

      - name: Syntax check
        run: |
          find nodejs/packages/periph/src nodejs/tests -name '*.js' \
            | xargs -I{} node --check {}

      - name: Verify chip drivers load
        run: |
          node -e "const m = require('./nodejs/packages/periph/src/chips/power/ina226'); \
                   if (!m.INA226Minimal || !m.INA226Full) process.exit(1)"

      - name: Check periph / Node-RED package READMEs are up to date
        run: node nodejs/scripts/generate-readmes.js --check

  # -----------------------------------------------------------------------
  # Java / Kotlin / Groovy — compile-only (no hardware required)
  # -----------------------------------------------------------------------
  java:
    name: Java compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile JVM modules
        run: mvn install --batch-mode --no-transfer-progress -DskipTests
        working-directory: jvm

  # -----------------------------------------------------------------------
  # ESP-IDF — compile-only (no hardware required).
  # Builds one example per transport to catch the regressions the
  # full retrofill would otherwise let through CI. The full chip
  # coverage matrix lives in `cpp/test_espidf.sh --compile-only`,
  # which we run against one chip per transport below.
  # -----------------------------------------------------------------------
  esp-idf:
    name: ESP-IDF compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ESP-IDF
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          mkdir -p /opt/esp
          cd /opt/esp
          git clone --depth 1 -b v5.2.7 https://github.com/espressif/esp-idf.git
          (cd esp-idf && git submodule update --init --depth 1)
          (cd esp-idf && ./install.sh)
          echo "IDF_PATH=/opt/esp/esp-idf" >> $GITHUB_ENV
          echo "/opt/esp/esp-idf/tools" >> $GITHUB_PATH

      - name: Build I2C example
        run: . "$IDF_PATH/export.sh" > /dev/null && cpp/test_espidf.sh --compile-only environmental/aht21
        env:
          ESPIDF_TARGET: esp32

      - name: Build SPI example
        run: . "$IDF_PATH/export.sh" > /dev/null && cpp/test_espidf.sh --compile-only pressure/bmp280
        env:
          ESPIDF_TARGET: esp32

      - name: Build UART example
        run: . "$IDF_PATH/export.sh" > /dev/null && cpp/test_espidf.sh --compile-only gnss/neo6
        env:
          ESPIDF_TARGET: esp32

      - name: Build NeoPixel example
        run: . "$IDF_PATH/export.sh" > /dev/null && cpp/test_espidf.sh --compile-only led/ws2812b
        env:
          ESPIDF_TARGET: esp32

      - name: Build HX711 example
        run: . "$IDF_PATH/export.sh" > /dev/null && cpp/test_espidf.sh --compile-only adc_dac/hx711
        env:
          ESPIDF_TARGET: esp32

  # -----------------------------------------------------------------------
  # Rust — compile-only (no hardware required)
  # -----------------------------------------------------------------------
  rust:
    name: Rust compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Compile workspace
        run: cargo build --manifest-path rust/Cargo.toml

  # -----------------------------------------------------------------------
  # Go — build + vet all packages (no hardware required)
  # -----------------------------------------------------------------------
  go-linux:
    name: Go compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        run: go build ./...
        working-directory: go

      - name: Vet
        run: go vet ./...
        working-directory: go

  # -----------------------------------------------------------------------
  # TinyGo — compile-only for Pico W, one example per transport type
  # -----------------------------------------------------------------------
  go-tinygo:
    name: TinyGo compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.41.0'

      - name: Cache TinyGo build cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/tinygo
          key: tinygo-pico-w-${{ hashFiles('go/go.sum') }}
          restore-keys: tinygo-pico-w-

      - name: Build examples (Pico W, one per transport)
        run: |
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/power/ina226/minimal       # I2C
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/led/ws2812b/minimal        # NeoPixel
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/humidity/dht11/minimal     # DHTxx
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/adc_dac/hx711/minimal      # HX711
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/rfid/mfrc522/minimal       # SPI
          tinygo build -target=pico-w -o /tmp/out.uf2 ./examples/tinygo/gnss/neo6/minimal          # UART
        working-directory: go
