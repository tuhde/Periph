name: Feature Request
description: Suggest an enhancement that isn't a new chip driver or transport
title: "feature: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve, or what use case does it enable?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Which implementations does this affect?
      options:
        - label: Python
        - label: C++
        - label: Node.js / Node-RED
        - label: Rust
        - label: JVM (Java / Kotlin / Groovy)
        - label: Go
        - label: Sigrok
        - label: Repository-wide (build, docs, workflow, etc.)

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else relevant — proposed API, alternatives considered, etc.
